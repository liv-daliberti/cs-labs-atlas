[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cs-atlas"
version = "2026.10.30"
description = "CS Labs Atlas: school -> PI lab -> papers + students, built from evidenced sources"
readme = "docs/README.md"
requires-python = ">=3.11"
license = { text = "Code: see the repository; data: see each release" }
# The pipeline's own needs. Exact versions: env/conda-linux-64.lock (the environment is built with conda from that lock,
# see docs/ENVIRONMENT.md); these ranges are what a pip install would accept.
dependencies = [
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "lxml>=5",
  "protego>=0.3",
  "rapidfuzz>=3",
  "pymupdf>=1.24",
  "numpy>=1.26",
  "huggingface_hub>=0.24",
]

[project.optional-dependencies]
# The ML/study stack for studies/ai-writing (SPECTER2 / Pythia studies, detectors, figures). Not in env/atlas: these
# run on the py310 env until a studies env is built (docs/ENVIRONMENT.md).
studies = [
  "torch>=2.1",
  "transformers>=4.40",
  "vllm",
  "scikit-learn",
  "scipy",
  "pandas",
  "pyarrow",
  "matplotlib",
  "pillow",
  "joblib",
]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
atlas = "atlas_cli:main"

[tool.setuptools]
# `pip install -e .` for interactive use: the flat modules of tools/ (import atlas_paths, import reader_export ...), the pihier package and the
# `atlas` command. Code snapshots and jobs do not use the install: they put their own tools/ on PYTHONPATH (tools/job_code_snapshot.sh).
# tests/test_imports_and_sys_path.py keeps py-modules equal to tools/*.py.
packages = ["atlas_cli", "pihier"]
py-modules = ["agent_lease", "atlas_ids", "atlas_paths", "atlas_pipeline", "atlas_release", "build_regression", "catalog_alias", "census_build", "chain_audit", "content_hash", "cs_related_candidates", "cs_related_school", "data_dictionary", "dblp_affiliated", "dblp_dump_index", "dblp_dump_persons", "dblp_ids_school", "dblp_recover", "diagnose_gaps", "evidence_check", "export_release", "faculty_periods", "hf_upload_release", "home_departments_school", "homepage_links_school", "lab_paper_copies", "labpage_audit", "labpage_recover", "labpage_students_school", "link_check", "link_diagnosis", "link_sweep", "listed_not_in_census", "listing_formats", "listing_rows", "lp_templates", "make_release", "missing_papers_audit", "mpcap", "new_school", "oa_identity_school", "oa_snapshot", "oa_snapshot_compare", "oa_sweep", "organize_tree", "package_diff", "periods_school", "pi_fulltext_affiliation", "pi_hierarchy", "provenance", "reader_export", "reader_links", "relation_recapture", "release_notes", "relocate_data", "relocate_project", "route_ft_data", "route_paths", "schema_check", "school_config", "school_hosts", "school_profiles", "school_web", "scratch", "secret_scan", "stage_gate", "stale_stages", "student_audit", "sweep_check", "sweep_school", "validate", "vendor_sync", "wire_charters", "wired_additions_report", "zero_paper_ledger"]

[tool.setuptools.package-dir]
atlas_cli = "atlas_cli"
pihier = "tools/pihier"
"" = "tools"

# ---------------------------------------------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 120
target-version = "py310"   # the code also runs on the py310 study env and the old Anaconda Python (3.11)
extend-exclude = [
  "vendor",                # copies of outside code, kept byte-close to their sources (tools/vendor_sync.py)
]

[tool.ruff.lint]
# Real problems only: syntax errors, undefined names, unused imports/variables, redefinitions, bad comparisons,
# invalid escape sequences. Style rules (E1/E2/E3/E5, E70x compound statements) are off: the code uses a dense,
# deliberate one-line style and reformatting it would churn every file without fixing anything.
select = ["E4", "E9", "F", "W6"]
ignore = [
  "F403", "F405",  # `from x import *` in the one-off research tools (hierarchy/*-tools), deliberate there
  "E401",   # several imports on one line (house style: import gzip, json, re, sys)
  "E402",   # imports after sys.path setup are the norm for scripts here
  "E741",   # short names like l, I in comprehensions
  "F841",   # unused local variables: 29 sites (2026-10-30), none a bug on review of the list; fixed by their owners
            # as they touch the code. `ruff check --select F841` lists them.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811"]   # pytest fixtures shadow imports

# -------------------------------------------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
# the code directories tests import from (no sys.path edits in tests/ or tools/; docs/CONTRIBUTING.md "Imports and sys.path")
pythonpath = ["tools", "fulltext-push", "listings/scripts", "vendor/cmu_tools", "vendor/homogenizing_scripts", "vendor/princeton_tools"]
addopts = "-q -p no:cacheprovider"
markers = [
  "nfs: needs the project data on /n/fs (packages, stores, sweeps); CI skips these (-m 'not nfs' or CS_ATLAS_CI=1)",
]
