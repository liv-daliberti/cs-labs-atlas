name: Website checks
on:
  push:
    branches: [website]
  pull_request:
    branches: [website]
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: black --check scripts/bootstrap.py scripts/data-package.py scripts/publish.py scripts/sync-host.py scripts/test-publication.py scripts/validate-data.py scripts/bundle-site.py
      - run: npm ci
      - run: npm test
      - run: npm run format:check
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: |
          npm run fixture
          ATLAS_DATA_DIR=outputs/fixture node portable/server.mjs > /tmp/atlas-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/readyz; then break; fi
            sleep 1
          done
          npm run smoke -- http://127.0.0.1:8787
          ATLAS_FIXTURE=1 npm run test:browser -- --grep 'synthetic fixture'
      - run: |
          docker build -t atlas-check -f portable/Dockerfile .
          docker run -d --name atlas-check -p 8789:8787 -v "$PWD/outputs/fixture:/data:ro" atlas-check
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8789/readyz; then break; fi
            sleep 1
          done
          npm run smoke -- http://127.0.0.1:8789
          docker stop atlas-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-test-report
          path: outputs/
          retention-days: 14
