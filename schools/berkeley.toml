# University of California, Berkeley: released before protocol v1 (built 2026-10-17..27). Only the fields the released build and the
# shared tools read are filled; the stage-tool fields (listing slots, hosts) live in that school's own sweep code.
key = "berkeley"
name = "University of California, Berkeley"
short = "UC Berkeley"
site_uni = "university-of-california-berkeley"
status = "released"
order = 5
stage = 10
legacy = true
window = [2016, 2026]

[ids]
openalex = ["I95457486"]
openalex_related = []
ror = "https://ror.org/01an7q238"
ids_note = "OpenAlex /institutions?filter=openalex_id 2026-10-29: display name and ROR as here"

[web]
domains = ["berkeley.edu"]

[affiliation]
regex = '(?:university\s+of\s+california|\buc)[\s,]+berkeley|berkeley\.edu'
own_units = ''
loose = 'berkeley'          # pi_hierarchy.SCHOOL_LOOSE: any mention of the school on page 1
must_match = []
must_not_match = []

[dblp]
affiliation_strings = []
legacy_sweep = "claude-berkeley-20261021"

[rules]
foreign_title_exception = false

[census]
computing_departments = ["EECS"]   # listed_not_in_census.py; [] = every listed department

[site]
depts = {EECS = "Electrical Engineering and Computer Sciences"}

[sweep_check]
# Reviewed exceptions to tools/sweep_check.py (each with its reason; verify = "papers_normal" re-checks the cause). Owner approved 2026-10-30.
exceptions = [
  {test = "year_outlier", year = 2026, verify = "papers_normal", reason = "36,836 of the 49,645 works of 2026 are DOE Pacific Northwest National Laboratory (PNNL) Repository dataset records (DOI prefix 10.25582; 38,074 datasets in all): OpenAlex type dataset, which every reader drops (pi_hierarchy.NOT_PAPERS, R-PAP-17). Paper-only count of 2026 (11,144) is in line with the other years. Diagnosed 2026-10-30; the release is unaffected."},
]

# Institutional-repository harvest (fulltext-push/oai_repo.py; verdicts in docs/CHANNELS.md, "Repository harvests", 2026-11-04)
[oai_repo]
verdict = "skip"
repository = "eScholarship (escholarship.org)"
reason = "CloudFront answers 403 'Request blocked' to this client for /robots.txt and /oai (2026-11-04): an access block, not a rule we may read, so nothing is fetched and no workaround is tried."

[collector]
# 2026-11-10 (owner): discovery channels re-enabled for every loop. wayback_acm stays OFF (and WAYBACK_HOLD=1 in the loop scripts) while Wayback listing captures run; CORE stays paused.
# Re-enable wayback_acm later: append "wayback_acm" here and set WAYBACK_HOLD=0 for the loops. OpenAlex spend is capped by OA_RESERVE=4000 (docs/CHANNELS.md).
channels = ["oa_arxiv", "openalex", "proceedings", "arxiv_title", "dblp_ee", "s2", "europepmc", "pmc", "figshare", "labpages", "pihomes"]
