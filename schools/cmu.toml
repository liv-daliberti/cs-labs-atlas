# Carnegie Mellon University: released before protocol v1 (built 2026-10-17..27). Only the fields the released build and the
# shared tools read are filled; the stage-tool fields (listing slots, hosts) live in that school's own sweep code.
key = "cmu"
name = "Carnegie Mellon University"
short = "Carnegie Mellon"
site_uni = "carnegie-mellon-university"
status = "released"
order = 2
stage = 10
legacy = true
window = [2016, 2026]

[ids]
openalex = ["I74973139"]
openalex_related = []
ror = "https://ror.org/05x2bcf33"
ids_note = "OpenAlex /institutions?filter=openalex_id 2026-10-29: display name and ROR as here"

[web]
domains = ["cmu.edu"]

[affiliation]
regex = 'carnegie[\s-]+mellon|\bcmu\b|cmu\.edu'
own_units = '\b(?:robotics|neuroscience|language technologies|human-computer interaction|software research|information networking|integrated innovation)\s+institute\b|\binstitute\s+for\s+software\s+research\b'
loose = 'carnegie|\bcmu\b'          # pi_hierarchy.SCHOOL_LOOSE: any mention of the school on page 1
must_match = []
must_not_match = []

[dblp]
affiliation_strings = []
legacy_sweep = "claude-cmu-20261017"

[rules]
foreign_title_exception = false
listing_continuity = true     # R-PAP-37, owner-approved 2026-11-06, 30-paper hand check passed

[census]
computing_departments = []   # listed_not_in_census.py; [] = every listed department
# home_units (gate 3 known_homes, 2026-11-13): the home-department labels of the released CMU census (hierarchy/cmu/derived/home-departments-school.json) are unit CODES;
# the seven SCS units are also [[departments]] below, the other codes are units searched for CS-related faculty.
home_units = {"CSD" = '^CSD$', "HCII" = '^HCII$', "RI" = '^RI$', "ECE" = '^ECE$', "CBD" = '^CBD$', "LTI" = '^LTI$', "S3D" = '^S3D$', "MLD" = '^MLD$', "Tepper" = '^Tepper$', "MechE" = '^MechE$', "Heinz" = '^Heinz$', "Mathematical Sciences" = '^Mathematical Sciences$', "CEE" = '^CEE$', "ChemE" = '^ChemE$', "EPP" = '^EPP$', "Psychology" = '^Psychology$', "Statistics & Data Science" = '^Statistics (?:&|and) Data Science$', "Philosophy" = '^Philosophy$', "Design" = '^Design$', "Architecture" = '^Architecture$', "Social and Decision Sciences" = '^Social and Decision Sciences$'}

[site]
depts = {CSD = "Computer Science Department", MLD = "Machine Learning Department", RI = "Robotics Institute", HCII = "Human–Computer Interaction Institute", LTI = "Language Technologies Institute", S3D = "Software and Societal Systems Department", CBD = "Computational Biology Department"}


# ---- Stage 1 departments (2026-11-13, gate-1 worker): the seven School of Computer Science units. One [[departments.listings]] entry per URL era; entries that share a
# slot name are one slot. Slot names are the names of listings/scripts/config_cmu.py (the plan rows in listings/cmu/raw/captures.sqlite are keyed by them), `format` names the
# page reader of that era (tools/listing_formats.py, cmu_*; the era that holds the capture date names the reader). Paged directories are separate page slots, and a
# [[departments.listing_groups]] entry says which slots make ONE complete roster for the years it covers (a year passes when any group that overlaps it has every slot
# ok in some half-year of that year). No waivers: a year without a complete roster stays open (docs/ADDING-A-SCHOOL.md, owner rule 2026-11-11).
# Not charter departments: the home-department gap-fill slots of config_cmu (ECE, MechE, Chemistry, Philosophy: home units of CS-related faculty, not CS-related units),
# the SCS directory API, and the adjunct/affiliated/emeritus/teaching/visiting slots of the seven units (their plan rows are kept; they are not roster slots).
[[departments]]
code = "CSD"
name = "Computer Science Department"
unit = "Carnegie Mellon University School of Computer Science"
title_match = 'Professor|Lecturer|Instructor|Scientist|Director'
