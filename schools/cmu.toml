# Carnegie Mellon University: released before protocol v1 (built 2026-10-17..27). Only the fields the released build and the
# shared tools read are filled; the stage-tool fields (listing slots, hosts) live in that school's own sweep code.
key = "cmu"
name = "Carnegie Mellon University"
short = "Carnegie Mellon"
site_uni = "carnegie-mellon-university"
status = "released"
order = 2
stage = 10
legacy = true
window = [2016, 2026]

[ids]
openalex = ["I74973139"]
openalex_related = []
ror = "https://ror.org/05x2bcf33"
ids_note = "OpenAlex /institutions?filter=openalex_id 2026-10-29: display name and ROR as here"

[web]
domains = ["cmu.edu"]

[affiliation]
regex = 'carnegie[\s-]+mellon|\bcmu\b|cmu\.edu'
own_units = '\b(?:robotics|neuroscience|language technologies|human-computer interaction|software research|information networking|integrated innovation)\s+institute\b|\binstitute\s+for\s+software\s+research\b'
loose = 'carnegie|\bcmu\b'          # pi_hierarchy.SCHOOL_LOOSE: any mention of the school on page 1
must_match = []
must_not_match = []

[dblp]
affiliation_strings = []
legacy_sweep = "claude-cmu-20261017"

[rules]
foreign_title_exception = false
listing_continuity = true     # R-PAP-37, owner-approved 2026-11-06, 30-paper hand check passed

[census]
computing_departments = []   # listed_not_in_census.py; [] = every listed department

[site]
depts = {CSD = "Computer Science Department", MLD = "Machine Learning Department", RI = "Robotics Institute", HCII = "Human–Computer Interaction Institute", LTI = "Language Technologies Institute", S3D = "Software and Societal Systems Department", CBD = "Computational Biology Department"}

# Institutional-repository harvest (fulltext-push/oai_repo.py; verdicts in docs/CHANNELS.md, "Repository harvests", 2026-11-04)
[oai_repo]
verdict = "harvest"
repository = "KiltHub (Figshare, kilthub.cmu.edu)"
base = "https://api.figshare.com/v2/oai"    # kilthub.cmu.edu answers a bot challenge (202, empty body): never used. Figshare's own OAI endpoint has no robots rules
prefix = "oai_dc"
sets = ["portal_231"]                        # the 'Carnegie Mellon University' portal (found in ListSets 2026-11-04)
delay = 3
relation_links = 'figshare\.com/articles/'
enrich = "figshare"
enrich_base = "https://api.figshare.com/v2"

