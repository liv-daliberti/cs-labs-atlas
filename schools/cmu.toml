# Institutional-repository harvest (fulltext-push/oai_repo.py; verdicts in docs/CHANNELS.md, "Repository harvests", 2026-11-04)
[oai_repo]
verdict = "harvest"
repository = "KiltHub (Figshare, kilthub.cmu.edu)"
base = "https://api.figshare.com/v2/oai"    # kilthub.cmu.edu answers a bot challenge (202, empty body): never used. Figshare's own OAI endpoint has no robots rules
prefix = "oai_dc"
sets = ["portal_231"]                        # the 'Carnegie Mellon University' portal (found in ListSets 2026-11-04)
delay = 3
relation_links = 'figshare\.com/articles/'
enrich = "figshare"
enrich_base = "https://api.figshare.com/v2"

# Hosts the cmu tools contact (stage 0, 2026-11-10). Derived from evidence: the raw capture stores (hierarchy/cmu/raw/*captures*.sqlite) and the full-text download ledger (stores/cmu/fulltext_assets.csv). The long tail of faculty personal sites is read per capture under school_web robots checks and is not enumerated here.
[[hosts]]
host = "web.archive.org"
use = "live"
purpose = "Wayback id_ captures and CDX (listings 2016-2026, lab pages) [stage 0 2026-11-10: probe skipped: https://web.archive.org/web/2020id_/https://www.cmu.edu/ answers http 302 (redirect to the nearest snapshot); entry otherwise as in the Michigan and Harvard charters]"
probe = ""

