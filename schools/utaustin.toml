# The University of Texas at Austin: top-25 push onboarding (coordinator brief scratch/top25-brief.md, 2026-11-07). Computing labs only; CS department full, other units through the CS-related-faculty rule.
key = "utaustin"
name = "The University of Texas at Austin"
short = "UT Austin"
site_uni = "the-university-of-texas-at-austin"
status = "onboarding"
order = 16
stage = 0
started = "2026-11-07"
window = [2016, 2026]

[ids]
# Stage-0 boundaries approved by owner 2026-11-11 (docs/STAGE0-COHORT-20261111.md): sweep every lineage child, PI rule filters; no related institutions.
openalex = ["I86519309"]
openalex_related = []
openalex_excluded = []
ror = "https://ror.org/00hj54h04"
ids_note = "tools/oa_institutions.py search/lineage on the local OpenAlex institutions snapshot (no API credits), 2026-11-07: I86519309 'The University of Texas at Austin' ROR 00hj54h04, lineage [I86519309]. Lineage children include Texas Advanced Computing Center I4388891828, Applied Research Laboratories I4388482719, Bureau of Economic Geology I4403928371, UT Health Austin I4387930201, Dell Children's Medical Center I4210102018, McDonald Observatory I4405285093, NSF-Simons AI Institute for Cosmic Origins I4405256350, Marine Science Institute I4405282909, Lady Bird Johnson Wildflower Center I4405283265, Brackenridge Field Lab I4405284063 and others. Other UT System campuses (Dallas, Arlington, San Antonio, Houston, Southwestern, MD Anderson) are separate OpenAlex institutions and not swept."

[web]
domains = ["utexas.edu"]
email_domains = ["utexas.edu"]
wayback_only_suffixes = []
excluded_hosts = []

[affiliation]
regex = '''\b(?:the\s+)?univ(?:ersity|\.)?\s+of\s+texas\s*(?:,|at|in|-|–)?\s*austin\b|\bUT[-\s]Austin\b|\butexas\.edu\b|\b[\w-]+\.utexas\.edu\b'''
loose = '''austin|utexas\.edu|texas\s+advanced\s+computing|oden\s+institute'''
own_units = '''\boden\s+institute\b|\btexas\s+advanced\s+computing\s+center\b|\bapplied\s+research\s+laboratories\b|\bmcdonald\s+observatory\b'''
must_match = [
  "The University of Texas at Austin, Austin, TX, USA",
  "Department of Computer Science, University of Texas at Austin",
  "Univ. of Texas at Austin",
  "University of Texas, Austin",
  "UT Austin",
  "jdoe@cs.utexas.edu",
  "Oden Institute for Computational Engineering and Sciences, The University of Texas at Austin"
]
must_not_match = [
  "University of Texas at Dallas, Richardson, TX",
  "University of Texas at San Antonio",
  "University of Texas at Arlington",
  "The University of Texas MD Anderson Cancer Center, Houston",
  "UT Southwestern Medical Center, Dallas",
  "Texas A&M University, College Station",
  "Austin College, Sherman, TX",
  "Austin Peay State University",
  "University of Texas Rio Grande Valley",
  "jdoe@utdallas.edu"
]

[dblp]
affiliation_strings = ["University of Texas at Austin", "The University of Texas at Austin", "UT Austin", "University of Texas, Austin"]
legacy_sweep = ""

[census]
computing_departments = ["CS"]
center_units = ["TACC", "ROBOTICS", "OKCAI"]
home_units = {"Computer Science" = 'computer\s+science', "Electrical and Computer Engineering" = 'electrical\s+(?:and|&)\s+computer\s+engineering', "Oden Institute" = 'oden\s+institute|computational\s+(?:engineering|science)', "Statistics and Data Sciences" = 'statistics\s+and\s+data\s+sciences?', "Information" = 'school\s+of\s+information'}
rank_words = {teaching = '\\bprofessor\\s+of\\s+instruction\\b|\\bsenior\\s+lecturer\\b|\\blecturer\\b', adjunct = '\\badjunct\\b|\\bprofessor\\s+of\\s+practice\\b'}

