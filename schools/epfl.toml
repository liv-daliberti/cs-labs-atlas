# Institutional-repository harvest (fulltext-push/oai_repo.py; verdicts in docs/CHANNELS.md, "Repository harvests", 2026-11-04)
[oai_repo]
verdict = "harvest"
repository = "Infoscience (DSpace-CRIS 7)"
kind = "oai"
base = "https://infoscience.epfl.ch/server/oai/openaire4"   # /server/oai/request answers 400; the OpenAIRE context is the working one
prefix = "oai_openaire"                                      # datacite creators, DOIs and oaire:file access URIs
sets = ["col_20.500.14299_7", "col_20.500.14299_3", "col_20.500.14299_11", "col_20.500.14299_12", "col_20.500.14299_2"]   # journal articles; conferences; preprints; reports; books and parts
delay = 10
enrich = "dspace_bundles"                 # records found through the REST enumeration get their ORIGINAL PDFs from /core/items/<uuid>/bundles when they match
enrich_base = "https://infoscience.epfl.ch/server/api"

# The OAI endpoint answered HTTP 405 at page ~282 of the journal-articles set (2026-11-04, 28,167 records kept); owner: fill the gap through the REST
# interface the file downloads already use (robots.txt: only /server/opensearch/* and the front-end search paths are disallowed; /server/api is not).
[oai_repo.rest]
rest_base = "https://infoscience.epfl.ch/server/api"
scopes = ["20.500.14299/7", "20.500.14299/3", "20.500.14299/11", "20.500.14299/12", "20.500.14299/2"]   # journal articles; conferences; preprints; reports; books and parts
delay = 3

[collector]
# 2026-11-10 (owner): discovery channels re-enabled for every loop. wayback_acm stays OFF (and WAYBACK_HOLD=1 in the loop scripts) while Wayback listing captures run; CORE is allowed everywhere (DECISIONS 2026-11-15): core and core_bulk added to the list 2026-11-16.
# Re-enable wayback_acm later: append "wayback_acm" here and set WAYBACK_HOLD=0 for the loops. OpenAlex spend is capped by OA_RESERVE=4000 (docs/CHANNELS.md).
channels = ["oa_arxiv", "openalex", "proceedings", "arxiv_title", "dblp_ee", "s2", "core", "core_bulk", "europepmc", "pmc", "figshare", "labpages", "pihomes"]
