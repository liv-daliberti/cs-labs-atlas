# EPFL: released before protocol v1 (built 2026-10-17..27). Only the fields the released build and the
# shared tools read are filled; the stage-tool fields (listing slots, hosts) live in that school's own sweep code.
key = "epfl"
name = "EPFL"
short = "EPFL"
site_uni = "swiss-federal-institute-of-technology-lausanne"
status = "released"
order = 3
stage = 10
legacy = true
window = [2016, 2026]

[ids]
openalex = ["I5124864"]
openalex_related = []
ror = "https://ror.org/02s376052"
ids_note = "OpenAlex /institutions?filter=openalex_id 2026-10-29: display name and ROR as here"

[web]
domains = ["epfl.ch"]

[affiliation]
regex = '\bepfl\b|polytechnique\s+f[ée]d[ée]rale\s+de\s+lausanne|swiss\s+federal\s+institute\s+of\s+technology\s+(?:in\s+|at\s+)?lausanne|epfl\.ch'
own_units = ''
loose = 'epfl|lausanne'          # pi_hierarchy.SCHOOL_LOOSE: any mention of the school on page 1
must_match = []
must_not_match = []

[dblp]
affiliation_strings = []
legacy_sweep = "claude-epfl-20261019"

[rules]
foreign_title_exception = true

[census]
computing_departments = []   # listed_not_in_census.py; [] = every listed department

[site]
depts = {IC = "School of Computer and Communication Sciences (IC)"}

# Institutional-repository harvest (fulltext-push/oai_repo.py; verdicts in docs/CHANNELS.md, "Repository harvests", 2026-11-04)
[oai_repo]
verdict = "harvest"
repository = "Infoscience (DSpace-CRIS 7)"
kind = "oai"
base = "https://infoscience.epfl.ch/server/oai/openaire4"   # /server/oai/request answers 400; the OpenAIRE context is the working one
prefix = "oai_openaire"                                      # datacite creators, DOIs and oaire:file access URIs
sets = ["col_20.500.14299_7", "col_20.500.14299_3", "col_20.500.14299_11", "col_20.500.14299_12", "col_20.500.14299_2"]   # journal articles; conferences; preprints; reports; books and parts
delay = 10
