# EPFL: released before protocol v1 (built 2026-10-17..27). The IC listing
# slot below matches the retained legacy plan in listings/epfl/raw/captures.sqlite.
# tools/listing_coverage_epfl.py verifies its sources before adding protocol
# department-year coverage; the released census still uses the legacy build.
key = "epfl"
name = "EPFL"
short = "EPFL"
site_uni = "swiss-federal-institute-of-technology-lausanne"
status = "released"
order = 3
stage = 10
legacy = true
window = [2016, 2026]

[ids]
openalex = ["I5124864"]
openalex_related = []
ror = "https://ror.org/02s376052"
ids_note = "OpenAlex /institutions?filter=openalex_id 2026-10-29: display name and ROR as here"

[web]
domains = ["epfl.ch"]

[[departments]]
code = "IC"
name = "Computer and Communication Sciences"
unit = "School of Computer and Communication Sciences"
title_match = 'computer\s+and\s+communication\s+sciences|\bIC\b'
coverage = "full"
url = "https://www.epfl.ch/schools/ic/about/faculty-members/"
  [[departments.listings]]
  slot = "IC professors and senior scientists"
  kind = "main"
  url = "ic.epfl.ch/professors"
  from = "20160101"
  to = "20191231"
  [[departments.listings]]
  slot = "IC professors and senior scientists"
  kind = "main"
  url = "ic.epfl.ch/professeurs"
  from = "20160101"
  to = "20191231"
  [[departments.listings]]
  slot = "IC professors and senior scientists"
  kind = "main"
  url = "www.epfl.ch/schools/ic/about/faculty-members/"
  from = "20190101"
  to = "20261231"

# Stage-0 routing for the institutional hosts used by the current faculty,
# profile, and repository evidence. Historical ic.epfl.ch faculty pages are
# read only from dated captures; the current IC directory is on www.epfl.ch.
[[hosts]]
host = "www.epfl.ch"
use = "live"
purpose = "current faculty directory and institutional pages"
probe = "https://www.epfl.ch/schools/ic/about/faculty-members/"

[[hosts]]
host = "people.epfl.ch"
use = "live"
purpose = "faculty profiles and unit appointments"
probe = "https://people.epfl.ch/daniel.thalmann?lang=en"

[[hosts]]
host = "infoscience.epfl.ch"
use = "live"
purpose = "institutional repository records and full texts"
probe = "https://infoscience.epfl.ch/server/api/core/communities/search/top?page=0&size=1"

[[hosts]]
host = "ic.epfl.ch"
use = "wayback-only"
purpose = "historical IC faculty listings"
probe = ""

[affiliation]
regex = '\bepfl\b|polytechnique\s+f[ée]d[ée]rale\s+de\s+lausanne|swiss\s+federal\s+institute\s+of\s+technology\s+(?:in\s+|at\s+)?lausanne|epfl\.ch'
own_units = ''
loose = 'epfl|lausanne'          # pi_hierarchy.SCHOOL_LOOSE: any mention of the school on page 1
must_match = []
must_not_match = []

[dblp]
affiliation_strings = []
legacy_sweep = "claude-epfl-20261019"

[rules]
foreign_title_exception = true

[census]
computing_departments = []   # listed_not_in_census.py; [] = every listed department
# stage-3 gate (R8): the stored home names are EPFL's own school / institute names from each PI's people.epfl.ch breadcrumb (school names: epfl.ch/schools/; institutes: epfl.ch/research/domains/); exact-name keys, no title text
home_units = {"College of Management of Technology (CDM)" = '^College of Management of Technology \(CDM\)$', "College of Management of Technology (CDM) — Management of Technology & Entrepreneurship Institute (MTEI)" = '^College of Management of Technology \(CDM\) — Management of Technology & Entrepreneurship Institute \(MTEI\)$', "College of Management of Technology (CDM) — Swiss Finance Institute (SFI)" = '^College of Management of Technology \(CDM\) — Swiss Finance Institute \(SFI\)$', "School of Architecture, Civil and Environmental Engineering (ENAC)" = '^School of Architecture, Civil and Environmental Engineering \(ENAC\)$', "School of Architecture, Civil and Environmental Engineering (ENAC) — Civil Engineering Institute (IIC)" = '^School of Architecture, Civil and Environmental Engineering \(ENAC\) — Civil Engineering Institute \(IIC\)$', "School of Architecture, Civil and Environmental Engineering (ENAC) — Environmental Engineering Institute (IIE)" = '^School of Architecture, Civil and Environmental Engineering \(ENAC\) — Environmental Engineering Institute \(IIE\)$', "School of Architecture, Civil and Environmental Engineering (ENAC) — Institute of Architecture (IA)" = '^School of Architecture, Civil and Environmental Engineering \(ENAC\) — Institute of Architecture \(IA\)$', "School of Basic Sciences (SB)" = '^School of Basic Sciences \(SB\)$', "School of Basic Sciences (SB) — Institute of Chemical Sciences and Engineering (ISIC)" = '^School of Basic Sciences \(SB\) — Institute of Chemical Sciences and Engineering \(ISIC\)$', "School of Basic Sciences (SB) — Institute of Mathematics (MATH)" = '^School of Basic Sciences \(SB\) — Institute of Mathematics \(MATH\)$', "School of Basic Sciences (SB) — Institute of Physics (IPHYS)" = '^School of Basic Sciences \(SB\) — Institute of Physics \(IPHYS\)$', "School of Computer and Communication Sciences (IC)" = '^School of Computer and Communication Sciences \(IC\)$', "School of Computer and Communication Sciences (IC