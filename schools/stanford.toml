# Stanford University: released before protocol v1 (built 2026-10-17..27). Only the fields the released build and the
# shared tools read are filled; the stage-tool fields (listing slots, hosts) live in that school's own sweep code.
key = "stanford"
name = "Stanford University"
short = "Stanford"
site_uni = "stanford-university"
status = "released"
order = 6
stage = 10
legacy = true
window = [2016, 2026]

[ids]
openalex = ["I97018004"]
openalex_related = []
ror = "https://ror.org/00f54p054"
ids_note = "OpenAlex /institutions?filter=openalex_id 2026-10-29: display name and ROR as here"

[web]
domains = ["stanford.edu"]

[affiliation]
regex = 'stanford\.edu|\bstanford\b(?!\s+research\s+(?:institute|systems|international))'
own_units = ''
loose = 'stanford'          # pi_hierarchy.SCHOOL_LOOSE: any mention of the school on page 1
must_match = []
must_not_match = []

[dblp]
affiliation_strings = []
legacy_sweep = "claude-stanford-20261027"

[rules]
foreign_title_exception = false

[census]
computing_departments = ["CS", "EE"]   # listed_not_in_census.py; [] = every listed department
home_units = {"CS" = '^CS$', "EE" = '^EE$', "Aeronautics and Astronautics" = '^Aeronautics and Astronautics$', "Mechanical Engineering" = '^Mechanical Engineering$', "Communication" = '^Communication$', "Management Science and Engineering" = '^Management Science and Engineering$', "Mathematics" = '^Mathematics$', "Computational Medicine" = '^Computational Medicine$', "Radiology" = '^Radiology$', "Civil and Environmental Engineering" = '^Civil and Environmental Engineering$', "Earth System Science" = '^Earth System Science$', "Clinical Informatics" = '^Clinical Informatics$', "Energy Science & Engineering" = '^Energy Science & Engineering$', "Biomedical Data Science" = '^Biomedical Data Science$', "Urology" = '^Urology$', "Operations, Information & Technology" = '^Operations, Information & Technology$', "Philosophy" = '^Philosophy$', "Genetics" = '^Genetics$', "Statistics" = '^Statistics$', "Graduate School of Education" = '^Graduate School of Education$', "Stanford Law School" = '^Stanford Law School$', "Music" = '^Music$', "Radiology - Pediatric Radiology" = '^Radiology \- Pediatric Radiology$', "Neurobiology" = '^Neurobiology$', "Economics" = '^Economics$', "Psychology" = '^Psychology$', "Linguistics" = '^Linguistics$', "Neurosurgery" = '^Neurosurgery$', "Psychiatry and Behavioral Sciences" = '^Psychiatry and Behavioral Sciences$', "Bioengineering" = '^Bioengineering$', "Radiation Oncology" = '^Radiation Oncology$', "Marketing" = '^Marketing$', "Medicine (Computational Medicine)" = '^Medicine \(Computational Medicine\)$'}
rank_words = {adjunct = '\bconsulting\s+(?:(?:associate|assistant)\s+)?professor'}

[site]
depts = {CS = "Computer Science", EE = "Electrical Engineering"}

# Institutional-repository harvest (fulltext-push/oai_repo.py; verdicts in docs/CHANNELS.md, "Repository harvests", 2026-11-04)
[oai_repo]
verdict = "skip"
repository = "Stanford Digital Repository / PURL (purl.stanford.edu)"
reason = "no OAI-PMH endpoint on purl.stanford.edu or searchworks.stanford.edu (HTML 404 pages, 2026-11-04). The robots-listed sitemaps give PURL URLs only, no metadata, so a harvest would be one request per PURL over the whole repository: not a bulk interface. robots.txt has no rule for ClaudeBot/anthropic-ai."

# Hosts the stanford tools contact (stage 0, 2026-11-10). Derived from evidence: the raw capture stores (hierarchy/stanford/raw/*captures*.sqlite) and the full-text download ledger (stores/stanford/fulltext_assets.csv). The long tail of faculty personal sites is read per capture under school_web robots checks and is not enumerated here.
# The CS directory includes every printed faculty category. The EE Bulletin
# supplies the earlier unpaged faculty roster; later department pages must have
# every linked page before they count. Neither department has gap waivers.
[[departments]]
code = "CS"
name = "Computer Science"
unit = "Stanford University"
title_match = 'Computer Science'
coverage = "full"
url = "https://www.cs.stanford.edu/people-cs/faculty-name"
  [[departments.listings]]
  slot = "CS faculty directory 2016-2023"
  kind = "main"
  url = "www.cs.stanford.edu/directory/faculty"
  from = "20160101"
  to = "20231231"
  format = "stanford_cs_legacy"
  [[departments.listings]]
