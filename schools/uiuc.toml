ids_note = """Verified 2026-11-23 against the local OpenAlex institutions snapshot with oa_institutions.py search and lineage.
Primary I157725225, ROR 047426m28. Internal lineage children retained: NCSA I4210135837 and XSEDE I4210158039,
Illinois Space Grant I4210090450, ACCESS I4387152812, Leggett Institute I4405252470, Lemann Center I4405261000,
Illinois State Geological Survey I4405262580. Excluded campuses: UIC I39422238, UIS I79884896, UIC Rockford I4210110323,
Peoria I4210130227; system office I2801919071 and UIC hospital I4210125096 do not establish UIUC affiliation.
Shared multi-institution lineage children Biohub Chicago I4396570630 and CloudBank I4405259881 are excluded.
No related-only institution is swept (including Carle, Amita, Advanced Digital Sciences Center, C3.ai DTI and Taylor Geospatial).
Owner approved 2026-11-23: Urbana-Champaign and internal research centers including NCSA; exclude Chicago/Springfield,
separately affiliated hospitals, Biohub and joint institutes. Joint appointees need independent UIUC faculty evidence.
ROR API could not be read through the web tool; the ROR identifier is verified from the snapshot, not a live ROR response."""

