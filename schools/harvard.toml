# Statistics, Economics, Mathematics, Physics, Psychology, Astronomy (FAS hosts *.fas.harvard.edu, math/physics.harvard.edu) answer this client's robots.txt with an Akamai 'Access Denied' 403
# (2026-11-05): not used, not via Wayback (coordinator's rule); their computing people are still found through the OpenAlex rule and DBLP. Owner decision D5.

# --- students ----------------------------------------------------------------------------------------------------------------------
[thesis]
kind = "none"
base_url = ""
endpoints = []
robots = "allowed"
note = "DASH (dash.harvard.edu, DSpace 7): robots.txt allows /entities/publication/<uuid> and /items (no AI-agent group, no Crawl-delay; Disallow /search /browse /entities/*/*/* /processes ...). Sitemaps hold 103,850 URLs (2,620 publication pages in sitemap2, about 100k items in sitemap0-1). One probe of an item page after five sitemap requests got 'Web Firewall 429 - The service is under heavy load' (2026-11-05): treated as a challenge, not retried, host marked use = none. At 100,000 records and the house 5 s minimum that would be 139 hours; DASH holds few dissertations (Harvard theses go through ProQuest and the departments), so it is not a student source. OAI is not probed."

[collector]
channels = ["oa_arxiv", "openalex", "s2", "labpages"]

[students]
directories = []
adviser_directories = []
defense_lists = []
adviser_alumni = []
rosters = []
sources = [
  "lab member pages and PI homepages (live where robots allows, else Wayback)",
  "SEAS PhD student and alumni directories (seas.harvard.edu), if archived",
  "ProQuest / OpenAlex / CORE thesis metadata (never DASH crawling)",
]

[labpages]
skip_pages = []
hints = ["<lab>.seas.harvard.edu", "seas.harvard.edu/person/<name>", "scholar.harvard.edu/<name>", "<name>.github.io", "sites.google.com/view/<lab>", "projects.iq.harvard.edu/<lab>"]

[repository]
name = "DASH (Digital Access to Scholarship at Harvard, dash.harvard.edu): reached through OpenAlex and CORE; direct fetches stopped at a web-firewall 429"
pattern = '''dash\.harvard\.edu|nrs\.harvard\.edu|Digital Access to Scholarship at Harvard'''

[store]
path = "/n/fs/resemble/homogenizing-science/stores/harvard"

