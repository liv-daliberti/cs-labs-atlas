[thesis]
kind = "none"
base_url = "https://jscholarship.library.jhu.edu/"
endpoints = []
robots = "disallowed-for-ai-agents"
note = "JScholarship (DSpace) robots.txt, read 2026-11-05: 'User-agent: ClaudeBot / anthropic-ai / Claude-Web: Disallow: /' (the Cloudflare managed block, Content-Signal ai-train=no). Not used in any form, not through Wayback either (Michigan's Deep Blue rule, L-67): crawl hours = 0 because nothing is fetched. JHU dissertations reach us only through OpenAlex (and CORE once it resumes); student relations come from lab pages and the CS/CLSP lists."

