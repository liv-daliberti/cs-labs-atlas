# --- departments -------------------------------------------------------------------------------------------------------------
# Computing sits in the Whiting School of Engineering's Department of Computer Science (full coverage). ECE, Applied Mathematics and Statistics and Biomedical Engineering are
# affiliated departments (computing faculty by the share test). The CLSP, Malone, LCSR, Cognitive Science, Mathematics and DSAI are searched units.
# Biostatistics (Bloomberg School) is out: its host disallows ClaudeBot/anthropic-ai (never used, Wayback included) and the department is not computing (owner 2026-11-05).
# Listing URLs below are the CURRENT ones; stage 1 finds the URL eras with tools/discover_listings.py (no Wayback fetching in stage 0). D6: borderline departments.
[[departments]]
code = "CS"
name = "Department of Computer Science"
unit = "Whiting School of Engineering"
