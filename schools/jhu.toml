# schools/jhu.toml: Johns Hopkins University's charter (docs/ADDING-A-SCHOOL.md, v3 stage 0), filled whole on 2026-11-05.
# Facts here are decisions about where to look, not evidence. The lineage / related / excluded ids are DRAFTS until the owner answers D1-D6
# (hierarchy/jhu/STAGE-0.md): nothing below is swept or extended into the snapshot before that.

key = "jhu"
name = "Johns Hopkins University"
short = "Johns Hopkins"
site_uni = "johns-hopkins-university"
status = "released"
order = 11                 # Harvard 10, Johns Hopkins 11, WashU 12
stage = 9
started = "2026-11-05"
window = [2016, 2026]

[ids]
openalex = ["I145311948"]
# OWNER DECISION 2026-11-05 (relayed by the coordinator): keep ONLY labs that do computing; anything that is not computing is not needed. APL, JHU Medicine / Hospital, the Bloomberg School,
# the SAIS campuses and Carey have no blanket keep or drop: a unit counts only through its computing labs, i.e. faculty who meet the CS-related scope rule (docs/RULES.md). APL staff are not JHU
# faculty and the PI rule is unchanged (a PI is a faculty member of the school), so APL adds PIs only through computing researchers with a JHU faculty appointment (e.g. a Whiting joint appointment);
# APL strings stay in the regex / own_units so in-scope PIs' papers that list APL are credited, and never add PIs or labs by themselves.
# The lineage of I145311948 holds the Applied Physics Laboratory I2802946424 and 12 smaller units (ids_note). Johns Hopkins Medicine I2799853436, the Hospital I4210150714, Bayview I2802697821 and
# Children's Center I4210129832 are NOT in the lineage (associated 'related'; Medicine is its own lineage root). Still open (STAGE-0.md): which ids go to openalex_related / openalex_excluded.
# OWNER DECISIONS 2026-11-05 (D2-D4, as recommended): related = Johns Hopkins Medicine only (the Hospital and Bayview carry Medicine in their lineage; an authorship tagged only with Medicine counts
# only when its raw string matches the regex, and under the computing rule only through computing PIs). Excluded (per-affiliation filter, joint JHU bylines unaffected): Maryland Space Grant, JHU Press, Center for
# Communication Programs, Center for AIDS Research, Packard Center, Berman Bioethics, SAIS Bologna, JHU-Nanjing Center. Kept in the sweep: APL, HEMI, PARADIM, MSEE URA, Materials Facility (APL adds PIs only via JHU faculty appointments).
# jhmi.edu / hopkinsmedicine.org stay in the regex. 'order' is set by the coordinator at landing.
openalex_related = ["I2799853436"]
openalex_excluded = ["I4210120405", "I4394709191", "I4210151848", "I4389425327", "I4392738135", "I4210092215", "I4210131961", "I4210162165"]
ror = "https://ror.org/00za53h95"
ids_note = """OpenAlex institutions table of the 2026-10-14 snapshot (no API credits; checked 2026-11-05, atlas run tools/oa_institutions.py search/lineage): I145311948 'Johns Hopkins University',
ROR 00za53h95, country US, type education, lineage [I145311948]. Lineage children (also ROR children): Applied Physics Laboratory I2802946424, Berman Institute of Bioethics I4210092215,
Center for Communication Programs I4210151848, SAIS Bologna Center I4210131961 (lineage also holds the SAIS root I4390039338), JHU-Nanjing University Center for Chinese and American Studies I4210162165
(lineage also holds Nanjing University I881766915), Maryland Space Grant Consortium I4210120405, PARADIM I4387152773, Materials Science in Extreme Environments URA I4388891755, Center for AIDS Research I4389425327,
Hopkins Extreme Materials Institute I4391012584, Packard Center I4392738135, Johns Hopkins University Press I4394709191, Materials Characterization and Processing Facility I4405260374.
Associated 'related', not lineage: Johns Hopkins Medicine I2799853436, Hospital I4210150714 (lineage Medicine + itself), Bayview Medical Center I2802697821, Children's Center I4210129832,
All Children's Hospital I4210098865 (St. Petersburg FL), Howard County General Hospital, Peninsula Regional Medical Center, Hospital Punta Pacifica, Tawam Hospital, Saudi Aramco Medical Services,
Konza Prairie LTER. Not JHU: Hopkins Marine Station I4405266016 (Stanford), Hopkins Architects, Pitt Hopkins Research Foundation, Hopkins Memorial Forest (Williams College).
ROR record read at api.ror.org/v2 on 2026-11-05 (13 children, 9 related, same list)."""

[web]
domains = ["jhu.edu"]
email_domains = ["jhu.edu", "cs.jhu.edu", "jhmi.edu", "jhuapl.edu", "hopkinsmedicine.org"]
wayback_only_suffixes = []
excluded_hosts = []   # hopkinsmedicine.org and jhuapl.edu are separate domains of Medicine and APL; no host of them is used until D2/D3 are decided

[affiliation]
# 'Johns Hopkins' (also 'John Hopkins', 'Johns-Hopkins'; not All Children's Hospital, a Florida hospital: owner instruction 2026-11-05), the jhu.edu, jhmi.edu, jhuapl.edu, jhsph.edu and
# hopkinsmedicine.org domains, 'JHU'. Never a bare 'Hopkins' (Hopkins Marine Station is Stanford's; Hopkins School, Pitt Hopkins, Gowland Hopkins) and never 'JHU' inside a longer word.
# The regex matches the Applied Physics Laboratory, the Hospital and the SAIS centres by name: whether those authorships count is D2/D3/D5 (the ids decide, not this regex).
regex = '''johns?[\s\-]+hopkins\b(?!\W+all\s+children)|\bjhu\b|\bjhu\.edu|jhmi\.edu|jhuapl\.edu|jhsph\.edu|hopkinsmedicine\.org'''
own_units = '''\b(?:hopkins\s+extreme\s+materials\s+institute|institute\s+for\s+assured\s+autonomy|data\s+science\s+and\s+ai\s+institute|institute\s+for\s+data\s+intensive\s+engineering\s+and\s+science|kavli\s+neuroscience\s+discovery\s+institute|mathematical\s+institute\s+for\s+data\s+science|institute\s+for\s+computational\s+medicine|malone\s+center|berman\s+institute\s+of\s+bioethics|center\s+for\s+language\s+and\s+speech\s+processing|laboratory\s+for\s+computational\s+sensing\s+and\s+robotics|human\s+language\s+technology\s+center\s+of\s+excellence)\b|\bhltcoe\b|\bidies\b'''
loose = '''johns?[\s\-]+hopkins|\bjhu\b|jhu\.edu|jhmi\.edu|jhuapl\.edu|baltimore,?\s+md\b'''
must_match = [
  "Johns Hopkins University, Baltimore, MD 21218, USA",
  "Department of Computer Science, Johns Hopkins University",
  "The Johns Hopkins University, 3400 N. Charles Street, Baltimore",
  "Center for Language and Speech Processing, Johns Hopkins University",
  "Whiting School of Engineering, Johns Hopkins",
  "John Hopkins University",
  "Johns-Hopkins University, Baltimore",
  "JHU, Baltimore, MD",
  "jdoe@jhu.edu",
  "Department of Biostatistics, Bloomberg School of Public Health, Johns Hopkins University",
  "Johns Hopkins University School of Medicine, Baltimore, MD",
  "Johns Hopkins University Applied Physics Laboratory, Laurel, MD",
  "Johns Hopkins University School of Advanced International Studies, Washington, DC",
]
must_not_match = [
  "Johns Hopkins All Children's Hospital, St. Petersburg, FL",
  "Johns Hopkins All Children's Hospital",
  "Hopkins Marine Station, Stanford University, Pacific Grove, CA",
  "Hopkins School, New Haven, CT",
  "Frederick Gowland Hopkins Laboratory, University of Cambridge",
  "Pitt Hopkins Research Foundation",
  "Mount Hopkins Observatory, Arizona",
  "Hopkins, MN 55343",
  "Morgan State University, Baltimore, MD",
  "University of Maryland, Baltimore County",
  "University of Maryland, College Park",
  "Loyola University Maryland",
  "jdoe@umd.edu",
  "Towson University",
  "Notre Dame of Maryland University",
  "Peabody Institute of Music",
]

[dblp]
affiliation_strings = ["Johns Hopkins University", "Johns Hopkins", "JHU"]
legacy_sweep = ""

[rules]
foreign_title_exception = false

[census]
courtesy_title_of = true   # owner rule (2026-11-18): a courtesy row titled "<Chair> Professor of <home unit>" counts as a home-unit professorship
computing_departments = ["CS"]
center_units = ["CLSP", "MALONE", "LCSR", "DSAI"]   # draft: centres, institutes and laboratories are never a PI's home (the ML Center rule, Georgia Tech); confirm at stage 3
home_units = {"Computer Science" = '^(?:Department of )?Computer Science$', "Electrical and Computer Engineering" = '^(?:Department of )?Electrical (?:and|&) Computer Engineering(?:$|,\s*Mechanical)', "Applied Mathematics and Statistics" = '^(?:Department of )?Applied Mathematics (?:and|&) Statistics(?:$|\s*& Physics)', "Biomedical Engineering" = '^(?:Department of )?Biomedical Engineering(?:$|\s*[,&])', "Civil and Systems Engineering" = '^(?:Department of )?(?:Civil|Civil and Systems|Systems) Engineering$', "Mechanical Engineering" = '^(?:Department of )?Mechanical Engineering$', "Materials Science and Engineering" = '^(?:Department of )?Materials Science (?:and|&) Engineering$', "Chemical and Biomolecular Engineering" = '^(?:Department of )?Chemical (?:and|&) Biomolecular Engineering$', "Biostatistics" = '^(?:Department of )?Biostatistics$', "Cognitive Science" = '^(?:Department of )?Cognitive Science$', "Mathematics" = '^(?:Department of )?Mathematics$', "Biomedical Informatics" = '^(?:Division of )?(?:Health Sciences )?(?:Biomedical )?(?:Informatics|Data Science)$', "Psychological and Brain Sciences" = '^(?:Department of )?Psychological (?:and|&) Brain Sciences$', "Economics" = '^(?:Department of )?Economics$', "Linguistics" = '^(?:Department of )?Linguistics$', "Neuroscience" = '^(?:The Solomon H\. Snyder )?(?:Department of )?Neuroscience$', "Physics and Astronomy" = '^(?:Department of )?Physics (?:and|&) Astronomy$', "Applied Physics Laboratory" = '^(?:Johns Hopkins )?(?:University )?Applied Physics Laboratory$', "Psychiatry and Behavioral Sciences" = '^(?:Department of )?Psychiatry and Behavioral Sciences$', "Genetic Medicine" = '^(?:Department of )?Genetic Medicine$', "General Internal Medicine" = '^(?:Division of )?General Internal Medicine(?:$|\s*& Biomedical Engineering)', "Radiology and Radiological Science" = '^(?:Department of )?Radiology(?: (?:and|&) Radiological Sciences?)?$', "Environmental Health and Engineering" = '^(?:Department of )?Environmental Health (?:and|&) Engineering$', "Urology" = '^(?:Department of )?Urology(?:, Brady Urological Institute)?$', "Radiation Oncology and Molecular Radiation Sciences" = '^(?:Department of )?Radiation Oncology (?:and|&) Molecular Radiation Sciences$', "Ophthalmology" = '^(?:Department of )?Ophthalmology$', "Anesthesiology and Critical Care Medicine" = "^Anesthesiology\\ and\\ Critical\\ Care\\ Medicine$", "Biology" = "^Biology$", "Bloomberg School of Public Health" = "^Bloomberg\\ School\\ of\\ Public\\ Health$", "Neurology" = "^Neurology$", "Neurosurgery" = "^Neurosurgery$", "Oncology" = "^Oncology$", "Orthopaedic Surgery" = "^Orthopaedic\\ Surgery$"}
# Source review 2026-11-07: when a secondary title explicitly names several academic units, canonicalize to its first named unit for grouping; the full joint title stays in the evidence.
# JHU title words: 'Professor of the Practice' and 'Teaching Professor' are shared RANKS already; add the research-faculty and secondary-appointment forms JHU pages use.
