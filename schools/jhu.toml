# Biostatistics (Bloomberg School) is out: its host disallows ClaudeBot/anthropic-ai (never used, Wayback included) and the department is not computing (owner 2026-11-05).
# Listing URLs below are the CURRENT ones; stage 1 finds the URL eras with tools/discover_listings.py (no Wayback fetching in stage 0). D6: borderline departments.
