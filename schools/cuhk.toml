[affiliation]
regex = '\b(?:the\s+)?chinese\s+university\s+of\s+hong\s+kong\b(?!\s*[,(-]?\s*shenzhen\b)|\bCUHK\b(?!\s*[,(-]?\s*(?:SZ|Shenzhen)\b|\.edu\.cn)|\b(?:[a-z0-9-]+\.)*cuhk\.edu\.hk\b'
excluded_regex = '\b(?:the\s+)?chinese\s+university\s+of\s+hong\s+kong\s*[,(-]?\s*shenzhen\b|\bCUHK\s*[,(-]?\s*(?:SZ|Shenzhen)\b'
loose = '\bchinese\s+university\s+of\s+hong\s+kong\b|\bCUHK\b|cuhk\.edu\.hk'
own_units = ''
must_match = ["The Chinese University of Hong Kong", "Department of Computer Science and Engineering, CUHK", "person@cse.cuhk.edu.hk"]
must_not_match = ["The Chinese University of Hong Kong, Shenzhen", "CUHK-Shenzhen", "CUHK (SZ)", "The University of Hong Kong", "Hong Kong Polytechnic University", "person@cuhk.edu.cn"]
[dblp]
