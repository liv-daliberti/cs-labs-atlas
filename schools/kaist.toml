# KAIST charter. Owner scope approved 2026-11-24 (D-0059, 'campus + children, no KIAS'): the KAIST campus I157485424 plus its OpenAlex lineage children
# National NanoFab Center I4210164985 and Intelligent Synthetic Biology Center I4210110126. Korea Institute for Advanced Study I125608817 and the Science and
# Technology Policy Institute I1306601404 are separate institutions (never swept, not related). No medical school, so no hospital class. Census 2016-2026
# including departed and retired faculty (as D-0045). First Korean school: the Han-name identity rules (D-0005/0010/0011/0013, pinyin) do not apply to romanized Korean names.
# schools/<key>.toml: one school's charter (docs/ADDING-A-SCHOOL.md, stage 0). Copy this file to schools/<key>.toml,
# fill every field, run `python tools/school_config.py --check <key>` and `python tools/school_hosts.py <key>`, then
# commit it. Every stage tool reads the school from here; nothing else needs a school list (see the protocol's
# "files that must learn a new school" for the few that still do).
#
# Facts in this file are decisions about where to look, not evidence: evidence (url + sha256 + verbatim quote) lives in
# the captures and the stage outputs. Say how each identifier was verified in the *_note fields.

key = "kaist"                  # lower-case, [a-z0-9]+; the folder name everywhere (hierarchy/<key>, stores/<key>, schools/<key>)
name = "Korea Advanced Institute of Science and Technology"                 # full official name ("University of Michigan")
short = "KAIST"
site_uni = ""             # the 300-university atlas id (SITE_DATA/universities/<site_uni>.json.gz), if any
status = "onboarding"     # onboarding | released. Only released schools are in atlas_paths.SCHOOL_IDS (the build,
                          # the release, the tree); flip it at stage 10, never earlier
order = 1000                 # display and build order (released schools are listed in this order)
stage = 0                 # the last stage whose gate passed (hierarchy/<key>/STAGE-<n>.md)
started = "2026-11-24"              # YYYY-MM-DD the onboarding started
window = [2016, 2026]     # the study window (owner rule; do not change per school)

[ids]
openalex = ["I157485424", "I4210164985", "I4210110126"]
openalex_related = []     # related (not lineage) institutions whose works are swept too; an authorship tagged only with
                          # one of these counts for the school only when its raw string matches [affiliation].regex
openalex_excluded = []    # same-name institutions that are NOT the school (other campuses), for the record and the tests
ror = "https://ror.org/05apxxy63"
ids_note = """Verified 2026-11-24 against the local OpenAlex institutions snapshot: tools/oa_institutions.py search 'Korea Advanced Institute' returns one hit, I157485424 'Korea Advanced Institute of Science and Technology', ROR 05apxxy63, KR, education; `lineage I157485424` lists associated children National NanoFab Center I4210164985 (facility) and Intelligent Synthetic Biology Center I4210110126 (other), both kept (D-0059); `children-counts` ran but the institutions snapshot carries no per-institution work counts (0 everywhere), so counts are measured after snapshot-ext.
Associated 'related' institutions Korea Institute for Advanced Study I125608817 (KIAS) and Science and Technology Policy Institute I1306601404 (STEPI) are separate institutions with their own faculty: never swept, not related, never add a PI (D-0059). No hospital class (KAIST has no medical school).
Look-alikes that must not match the regex: KIST (Korea Institute of Science and Technology), GIST, DGIST, UNIST, KISTI, ETRI, UST, and the Korea Science Academy of KAIST (a high school; lookbehind in the main regex plus excluded_regex). Korea Institute for Advanced Study is not matched either (the regex needs 'Korea Advanced Institute').
Live ROR API not queried in this run; the ROR id is the snapshot's."""

[evidence]
# Where this school's reviewed decisions are written (docs/EVIDENCE-STORE.md). "json" (default): the reviewed JSON files in
# hierarchy/<key>/reviewed/ are the source. "store": <stores>/<key>/evidence.sqlite is; the JSON files are an export
# (evidence_store.py sync) and a direct edit to them is refused by the pre-commit hook, `evidence_store.py check` and atlas doctor.
source = "json"
# unmanaged = []     # file-name patterns kept out of a store-sourced school's store and guard (tool-regenerated audit samples)
# shared = "json"   # "store" (needs source = "store"): the school's rows in the shared reviewed files (hierarchy/reviewed/*.json) are sourced from its store as well

