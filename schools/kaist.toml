[collector]
# Stage 8 (fulltext-push/school-collector.slurm, SCHOOL=<key>): which discovery channels the school's collector runs. Empty = the script's default list.
# The script restarts itself (--signal=B:USR1@900 + loop_job.sh); a school-specific copy must keep both.
channels = ["oa_arxiv", "openalex", "s2", "core", "core_bulk", "labpages"]

[students]
directories = []          # program PhD directories that list each student's website (no adviser): tools/labpage_students_school.py directory
adviser_directories = []  # current-student lists that name each student's adviser themselves (TTIC /students/): URL without scheme, Wayback captures
defense_lists = []        # proposal/defense lists naming each student's committee chair (Booth /phd/proposals-defenses, /phd/job-market-candidates)
adviser_alumni = []       # PhD alumni lists with 'Name PhD - YYYY Advisors - A and B' lines (TTIC /student-alumni/)
rosters = []              # names-only PhD rosters [{url, kind = students | alumni_by_year, paged = false, listed_as_phd = false}] (paged: follow ?page=N / A-Z pages of each capture; listed_as_phd: the page IS the PhD list, no 'Ph.D' mark per entry): a student counts only when the name is also on the byline of a lab paper of the PI (R-STU-02)
sources = ["KAIST library thesis records with explicit adviser metadata (OpenAlex/CORE or checked host only)", "PhD graduation and defense lists naming advisers", "PI-owned lab member and alumni pages", "student-owned pages naming their adviser"]

[labpages]
skip_pages = []           # [{url, why}]: lab pages a reviewer judged not to list this lab's members at the school (the extract step does not read them)
hints = ["https://cs.kaist.ac.kr/research", "https://ee.kaist.ac.kr/", "https://gsai.kaist.ac.kr/"]

[repository]
