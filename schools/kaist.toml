  "Korea Advanced Institute of Science and Technology (KAIST), Seoul Campus",
  "한국과학기술원",
  "카이스트 전산학부",
  "faculty@cs.kaist.ac.kr",
  "faculty@kaist.edu",
  "https://cs.kaist.ac.kr/people/faculty",
  "KAIST Institute for Artificial Intelligence",
]
