domains = ["kaist.ac.kr", "kaist.edu"]
email_domains = ["kaist.ac.kr", "kaist.edu", "cs.kaist.ac.kr", "ee.kaist.ac.kr"]
wayback_only_suffixes = []  # host suffixes read from Wayback only (a challenge in front of the whole domain); [[hosts]] override
excluded_hosts = ["kist.re.kr", "gist.ac.kr", "dgist.ac.kr", "unist.ac.kr", "kisti.re.kr", "etri.re.kr", "ust.ac.kr", "kias.re.kr", "stepi.re.kr", "ksa.hs.kr", "snu.ac.kr", "postech.ac.kr", "yonsei.ac.kr", "korea.ac.kr"]

[affiliation]
# Python regex, matched case-insensitively against raw affiliation strings and page-1 text. It must name the
# institution, never a bare town. Add every must_match / must_not_match case you checked; --check runs them.
regex = '''\bkorea(?:n)?\s+adv(?:anced|\.)?\s+inst(?:itute|\.)?\s+(?:of\s+)?sci(?:ence|\.)?\s*(?:and|&|,)?\s*tech(?:nology|\.)?|(?<!academy of )(?<!academy of the )\bKAIST\b|(?<![\w.-])(?:[\w-]+\.)*kaist\.(?:ac\.kr|edu)(?![\w-]|\.\w)|한국과학기술원|카이스트'''
excluded_regex = '''\bkorea(?:n)?\s+science\s+academy\b|\bKSA\s+of\s+KAIST\b|한국과학영재학교|\bkorea\s+institute\s+for\s+advanced\s+study\b|\bscience\s+and\s+technology\s+policy\s+institute\b'''
loose = '''\bKAIST\b|\bkorea\s+adv\w*\s+inst\w*\s+of\s+sci\w*|\bkaist\.(?:ac\.kr|edu)\b|\bdaejeon\b.{0,60}\bkaist\b|한국과학기술원|카이스트'''
own_units = '''\bnational\s+nanofab\s+center\b|\bintelligent\s+synthetic\s+biology\s+center\b|\bkim\s+jaechul\s+graduate\s+school\s+of\s+(?:ai|artificial\s+intelligence)\b|\bgraduate\s+school\s+of\s+data\s+science\b|\bschool\s+of\s+computing\b|\bkaist\s+institute\b'''
must_match = [
  "Korea Advanced Institute of Science and Technology",
  "Korea Advanced Institute of Science & Technology",
  "Korea Advanced Institute of Science and Technology, Daejeon 34141, Republic of Korea",
  "Korea Advanced Inst. of Science and Technology",
  "Korea Adv. Inst. Sci. Technol., Daejeon",
  "Korean Advanced Institute of Science and Technology",
  "KAIST",
