  "Electronics and Telecommunications Research Institute",
  "ETRI, Daejeon",
  "University of Science and Technology, Daejeon, Korea",
  "Korea Science Academy of KAIST",
  "Korea Science Academy of KAIST, Busan",
  "한국과학영재학교",
  "한국과학기술연구원",
  "Seoul National University",
  "Pohang University of Science and Technology",
  "faculty@kist.re.kr",
  "faculty@gist.ac.kr",
  "faculty@dgist.ac.kr",
  "faculty@unist.ac.kr",
  "faculty@etri.re.kr",
  "faculty@kias.re.kr",
  "https://notkaist.ac.kr.example.org/",
]

