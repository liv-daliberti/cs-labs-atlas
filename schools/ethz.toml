# ETH Zurich charter. Owner scope approved 2026-11-24 (D-0055, leases/coord/DECISIONS.md): the whole ETH OpenAlex lineage (I35440088), including CSCS,
# the Singapore-ETH Centre, Collegium Helveticum and the units ETH shares with UZH or EPFL; a PI still needs an ETH professor title (full, associate,
# assistant TT or non-TT, adjunct, titular; emeriti within the window) plus PhD-advising or own-lab evidence (D-0009); Senior Scientists and
# Privatdozenten without a professor title are not PIs (as the EPFL Rajman ruling). Separate institutions, never in scope: University of Zurich and its
# hospitals, PSI, Empa, WSL, Eawag, EPFL (its own school), IBM Research Zurich, Disney Research. Census 2016-2026 incl. departed and retired faculty (D-0045).
key = "ethz"
name = "ETH Zurich"
short = "ETH Zurich"
site_uni = ""
status = "onboarding"
order = 999   # provisional; GRAS 2025 CS&E rank 33
stage = 0
started = "2026-11-24"
window = [2016, 2026]

[ids]
openalex = ["I35440088"]
openalex_related = []
openalex_excluded = []
ror = "https://ror.org/05a28rw58"
ids_note = """Verified 2026-11-24. Local OpenAlex institutions snapshot (bin/atlas run tools/oa_institutions.py lineage I35440088): I35440088 'ETH Zurich', ROR 05a28rw58, CH, education.
Live ROR API (api.ror.org/v2/organizations/05a28rw58, 2026-11-24): active, Zurich, display name 'ETH Zurich', website ethz.ch; names include ETH, ETHZ, ETH Zuerich, 'Eidgenössische Technische Hochschule Zürich',
'Swiss Federal Institute of Technology (in) Zurich'; 108 ROR children (the 'Center for Radiopharmaceutical Sciences' has no OpenAlex id); parent 'Board of the Swiss Federal Institutes of Technology' (ETH Board, ROR 01rvn4p91); related: ETH Zürich Foundation, MAGIC Telescopes, NCCR Catalysis, Akademische Raumfahrt Initiative Schweiz, Araris Biotech AG.
The snapshot lineage lists 109 child/facility institutions, all kept (D-0055: nothing in the lineage is excluded unless it is really a separate institution; none is): the departments' institutes and laboratories, CSCS I4391767926 (Lugano), Singapore-ETH Centre I4405254519, Collegium Helveticum I4210133264, ETH Zürich Campus Heilbronn I4405256459, and the units shared with UZH or EPFL: Swiss Data Science Center I4210122261, Institute of Neuroinformatics I4405256566, Institute for Biomedical Engineering I4210090941, Wyss Zurich Translational Center I4405256927, Functional Genomics Center Zurich I4405257037, Language Center of UZH and ETH Zürich I4405253708. A shared unit adds institution-level credit only; a PI still needs an ETH appointment (UZH- or EPFL-appointed people in joint units are not ETH PIs, and joint-unit papers credit only in-scope ETH PIs).
Parent I2799323385 'Board of the Swiss Federal Institutes of Technology' is in every ETH-domain institution's lineage array (ETH, EPFL, PSI, Empa, WSL, Eawag) and must NEVER be an id here or in openalex_excluded: the sweep matches and the exclusion gate tests lineage ids, so it would pull in EPFL/PSI/Empa/WSL/Eawag or drop all of ETH.
openalex_related is empty: D-0055 names no related hospitals, and the five ROR 'related' entries (ETH Zürich Foundation I4391767848, MAGIC Telescopes I4400009057, NCCR Catalysis I4405252660, Akademische Raumfahrt Initiative Schweiz I4405253125, Araris Biotech I4405264921) are a fundraising foundation, multi-institution collaborations, a student initiative and a spin-off company, none an ETH appointment unit; they are not swept.
Separate institutions, not swept and not in the lineage (looked up 2026-11-24): University of Zurich I202697423 (own lineage, ROR 02crff812), Paul Scherrer Institute I2802229908, WSL I2800262456, Empa/Eawag (lineage under the ETH Board only), EPFL I5124864 (its own school), IBM Research Zurich and Disney Research (companies; no OpenAlex institution of the ETH lineage).
Look-alike trap: 'Swiss Federal Institute of Technology' alone is ambiguous (EPFL's old English name); the regex requires Zurich/Zürich next to it."""

