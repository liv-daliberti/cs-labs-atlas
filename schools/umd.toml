[ids]
openalex = ["I66946132"]
openalex_related = []
openalex_excluded = ["I4389425230", "I112475681", "I39822340", "I4210162509", "I126744593", "I4405257352", "I79272384", "I4210107443", "I22407884", "I149521062", "I1317227900", "I14285509"]
ror = "https://ror.org/047s2c258"
ids_note = """Verified 2026-11-24 against the local OpenAlex institutions snapshot (tools/oa_institutions.py lineage I66946132): I66946132 'University of Maryland, College Park', ROR 047s2c258, US, education.
Lineage children kept (D-0054): ARLIS I4388482636, ESSIC I4210144776, CISESS I4405270764 (lineage also runs to NOAA, which is a parent and is not swept), Maryland Quantum Materials Center I4405254040,
QuICS I4210108409 and JQI I4210151733 (NIST-joint; kept because their faculty hold UMD CS or Physics appointments). UMIACS has no OpenAlex id: it is covered by the affiliation regex.
Lineage children excluded (D-0054): IBBR I4389425230 (UMB/NIST joint, Rockville), JGCRI I112475681 (PNNL-run), Virginia-Maryland College of Veterinary Medicine I39822340 (shared; already a Virginia Tech lineage child). Associated, not a child, excluded: Fraunhofer USA Center Mid-Atlantic CMA I4210162509.
Separate institutions, never UMD: UMB I126744593 (School of Medicine I4405257352), UMBC I79272384, UMGC I4210107443, UMES I22407884, UMCES I149521062, University System of Maryland I1317227900 (parent), UM Medical System I14285509 and its hospitals. No hospital is related: College Park has no medical school.
Not in the lineage and not swept: Maryland Population Research Center I4405269951, Maryland Technology Enterprise Institute I4405273310, Maryland Water Resources Research Center I4405271574, Maryland Sea Grant I4210126686, Maryland Space Grant I4210120405.
Live ROR API not queried in this run; the ROR id is the snapshot's."""

