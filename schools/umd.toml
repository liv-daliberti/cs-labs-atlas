# UMD charter. Owner scope approved 2026-11-24 (D-0054): University of Maryland, College Park (I66946132, ROR 047s2c258) plus internal research centres
# (UMIACS by regex; ARLIS, ESSIC, CISESS, Maryland Quantum Materials Center; NIST-joint QuICS and JQI kept). IBBR, JGCRI, the Virginia-Maryland College of
# Veterinary Medicine and Fraunhofer USA CMA excluded. UMB, UMBC, UMGC, UMES, UMCES, USM and the UM Medical System are separate institutions. No hospital is related.
# Trap: a bare "University of Maryland" can be Baltimore, so the regex requires College Park (or umd.edu / UMIACS) evidence.
# Census 2016-2026 incl. departed and retired faculty (as D-0045). Computing faculty only, per RULES.md.
