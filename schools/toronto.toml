# University of Toronto: top-25 push onboarding (coordinator brief scratch/top25-brief.md, 2026-11-07). Computing labs only; CS department full, other units through the CS-related-faculty rule.
key = "toronto"
name = "University of Toronto"
short = "Toronto"
site_uni = "university-of-toronto"
status = "onboarding"
order = 15
stage = 0
started = "2026-11-07"
window = [2016, 2026]

[ids]
# Stage-0 owner decisions pending (hierarchy/toronto/reports/STAGE-0.md D1-D5); defaults below follow the Harvard/UChicago precedent and the brief: St. George computing labs only, PI rule filters sweeps.
openalex = ["I185261750"]
openalex_related = ["I4210127509", "I2801317318", "I1325899441"]
openalex_excluded = ["I530967"]
ror = "https://ror.org/03dbr7087"
ids_note = "OWNER 2026-11-10: scope is computing-related PIs of every unit incl. UTM, UTSC, hospitals/institutes with a Toronto appointment; Vector, SickKids and UHN stay openalex_related (a person counts only with a Toronto appointment stated on an official page). tools/oa_institutions.py search/lineage on the local OpenAlex institutions snapshot (no API credits), 2026-11-07: I185261750 'University of Toronto' ROR 03dbr7087, lineage [I185261750]. Lineage children: University of Toronto Scarborough I4405278283, Fields Institute I9267121, Canadian Institute for Theoretical Astrophysics I4210110940, Sunnybrook Research Institute I4391768120, Ted Rogers Centre for Heart Research I4210091032, AGE-WELL I4388891821. Related, not lineage: Vector Institute I4210127509, Hospital for Sick Children I2801317318, University Health Network I1325899441 (swept; credited only when the raw string matches); left out: Unity Health, Sunnybrook Hospital, Baycrest, Creative Destruction Lab and the other hospitals. Excluded: Toronto Metropolitan University I530967 (different university). UTM (Mississauga) has no OpenAlex institution of its own and rolls into I185261750."

[web]
domains = ["utoronto.ca", "toronto.edu"]
email_domains = ["utoronto.ca", "toronto.edu"]
wayback_only_suffixes = ["medbio.utoronto.ca", "www.utsc.utoronto.ca", "www.mathematics.utoronto.ca", "www.statistics.utoronto.ca", "www.matter.toronto.edu", "www.nivdayan.net", "lmp.utoronto.ca"]
excluded_hosts = []

[affiliation]
regex = '''\b(?:the\s+)?(?:university\s+of\s+toronto|univ\.?\s+of\s+toronto|toronto\s+univ(?:ersity)?\.?)\b(?!\s+(?:press|metropolitan))|\butoronto\.ca\b|\b[\w-]+\.toronto\.edu\b'''
loose = '''toronto|utoronto\.ca|vector\s+institute|sickkids|hospital\s+for\s+sick\s+children|university\s+health\s+network'''
own_units = '''\bvector\s+institute\b|\bfields\s+institute\b|\bschwartz\s+reisman\s+institute\b|\bacceleration\s+consortium\b'''
must_match = [
  "University of Toronto, Toronto, ON, Canada",
  "Department of Computer Science, University of Toronto",
  "Univ. of Toronto, Canada",
  "The University of Toronto Scarborough",
  "jdoe@cs.toronto.edu",
  "Vector Institute and University of Toronto",
  "University of Toronto Mississauga"
]
must_not_match = [
  "Toronto Metropolitan University, Toronto",
  "Ryerson University, Toronto",
  "York University, Toronto, Canada",
  "University of Toronto Press",
  "University of Waterloo, Waterloo, ON",
  "University Health Network, Toronto",
  "Vector Institute, Toronto, ON, Canada",
  "Toronto Western Hospital"
]

[dblp]
affiliation_strings = ["University of Toronto", "Univ. of Toronto", "Vector Institute"]
legacy_sweep = ""

[census]
computing_departments = ["CS"]
center_units = ["VECTOR", "ROBOTICS"]
home_units = {"Institute of Health Policy, Management and Evaluation (DLSPH)" = '^Institute of Health Policy, Management (?:and|&) Evaluation(?: \(DLSPH\))?$', "Computer Science" = 'computer science', "Mathematics" = 'department\s+of\s+mathematics|mathematical\s+sciences', "Mathematical and Computational Sciences (UTM)" = 'mathematical\s+(?:and|&)\s+computational\s+sciences', "Computer and Mathematical Sciences (UTSC)" = 'computer\s+(?:and|&)\s+mathematical\s+sciences', "Aerospace Studies" = 'aerospace\s+studies', "Biomedical Engineering" = 'biomedical\s+engineering|ibbme', "Medical Biophysics" = 'medical\s+biophysics', "Laboratory Medicine and Pathobiology" = 'laboratory\s+medicine', "Dalla Lana School of Public Health" = 'dalla\s+lana|public\s+health', "Electrical and Computer Engineering" = 'electrical\s+(?:and|&)\s+computer\s+engineering', "Mechanical and Industrial Engineering" = 'mechanical\s+(?:and|&)\s+industrial', "Statistical Sciences" = 'statistical\s+sciences', "Information" = 'faculty\s+of\s+information|ischool'}
rank_words = {teaching = '\bprofessor,?\s+teaching\s+stream\b|\blecturer\b', adjunct = '\bstatus[-\s]only\b|\badjunct\b'}

[sweep_check]
exceptions = []

[cs_related]
not_faculty = {}
share_test_settles = ["Hoi-Kwong Lo", "Xinyu Liu", "Kimberly Strong", "Michael D. Escobar"]  # hand review 2026-11-10: quantum key distribution hardware; bio-MEMS micromanipulation. Computing is not the object or the method; the share test (9-13% DBLP-indexed of 53-88 Toronto works) decides. (Michael D. Escobar, 2026-11-10: Bayesian biostatistics, share 11.8% of 51 works; Linbo Wang (causal inference with ML venues, share 17.6% of 17 works) kept accepted, flagged for the owner. Kimberly Strong, 2026-11-10: atmospheric physics and spectroscopy, 5 DBLP records only; share not_computing. James M. Drake and Milos R. Popovic appeared only on the MIE status-only page, now not a listing source.)

[site]
depts = {CS = "Computer Science"}
full_codes = ["CS"]

[periods]
school_regex = '''\b(?:the\s+)?(?:university\s+of\s+toronto|univ\.?\s+of\s+toronto|toronto\s+univ(?:ersity)?\.?)\b(?!\s+(?:press|metropolitan))|\butoronto\.ca\b|\b[\w-]+\.toronto\.edu\b'''

