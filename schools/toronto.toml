[sweep_check]
exceptions = []

[cs_related]
not_faculty = {}
share_test_settles = ["Hoi-Kwong Lo", "James M. Drake", "Milos R. Popovic", "Xinyu Liu"]  # hand review 2026-11-10: quantum key distribution hardware; surgical/medical devices (Drake, namesake risk); rehabilitation engineering; bio-MEMS micromanipulation. Computing is not the object or the method; the share test (7-13% DBLP-indexed of 53-179 Toronto works) decides

