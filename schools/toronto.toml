[ids]
# Stage-0 owner decisions pending (hierarchy/toronto/reports/STAGE-0.md D1-D5); defaults below follow the Harvard/UChicago precedent and the brief: St. George computing labs only, PI rule filters sweeps.
openalex = ["I185261750"]
openalex_related = ["I4210127509", "I2801317318", "I1325899441"]
openalex_excluded = ["I530967"]
ror = "https://ror.org/03dbr7087"
ids_note = "tools/oa_institutions.py search/lineage on the local OpenAlex institutions snapshot (no API credits), 2026-11-07: I185261750 'University of Toronto' ROR 03dbr7087, lineage [I185261750]. Lineage children: University of Toronto Scarborough I4405278283, Fields Institute I9267121, Canadian Institute for Theoretical Astrophysics I4210110940, Sunnybrook Research Institute I4391768120, Ted Rogers Centre for Heart Research I4210091032, AGE-WELL I4388891821. Related, not lineage: Vector Institute I4210127509, Hospital for Sick Children I2801317318, University Health Network I1325899441 (swept; credited only when the raw string matches); left out: Unity Health, Sunnybrook Hospital, Baycrest, Creative Destruction Lab and the other hospitals. Excluded: Toronto Metropolitan University I530967 (different university). UTM (Mississauga) has no OpenAlex institution of its own and rolls into I185261750."

[web]
