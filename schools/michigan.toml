# University of Michigan (Ann Arbor): the seventh school and the first one onboarded with the protocol
# (docs/ADDING-A-SCHOOL.md). Owner request 2026-10-29. Stage reports: hierarchy/michigan/STAGE-<n>.md.

key = "michigan"
name = "University of Michigan"
short = "Michigan"
site_uni = "university-of-michigan-ann-arbor"
status = "onboarding"
order = 7
stage = 1                 # gates passed in order: 0, 1 (2 waits on the OpenAlex sweep; 3 passed provisionally; see STAGE-*.md)
started = "2026-10-29"
window = [2016, 2026]

[ids]
openalex = ["I27837315"]
# Michigan Medicine (the U-M academic medical centre and health system) is a 'related' institution of the university in
# ROR and OpenAlex, not a child, so authors tagged only with it (Computational Medicine and Bioinformatics, Biostatistics
# collaborators, Learning Health Sciences) are not in I27837315's lineage. Its works are swept; such an authorship counts
# for Michigan only when its raw affiliation string matches [affiliation].regex (most read "University of Michigan
# Medical School"). Compare Stanford, whose health system is a child in its lineage. OWNER DECISION requested.
openalex_related = ["I4210114445"]
openalex_excluded = ["I4210130704", "I4210092198"]   # University of Michigan-Dearborn, University of Michigan-Flint
ror = "https://ror.org/00jmfr291"
ids_note = """api.openalex.org/institutions search 'University of Michigan' and filter=openalex_id, 2026-10-29:
I27837315 'University of Michigan', ROR 00jmfr291, lineage [I27837315] (no parent); Dearborn I4210130704 (ROR 035wtm547)
and Flint I4210092198 (ROR 01c3xc117) are separate institutions with their own lineage ('related'), so the lineage filter
excludes them. Michigan Medicine I4210114445 (ROR 01zcpa714) is 'related' both ways (api.ror.org v2, 2026-10-29)."""

[web]
domains = ["umich.edu"]
email_domains = ["umich.edu", "med.umich.edu"]
excluded_hosts = ["umd.umich.edu", "umflint.edu", "umdearborn.edu"]   # Dearborn (old domain umd.umich.edu) and Flint
wayback_only_suffixes = ["umich.edu"]   # every umich.edu host probed sat behind a Cloudflare challenge (stage 0); [[hosts]] entries override

[affiliation]
# 'University of Michigan' (any spelling of University, 'of' optional, 'Mich' abbreviated), not followed by Dearborn,
# Flint or Shanghai (the UM-SJTU Joint Institute is Shanghai Jiao Tong's: DBLP notes, learned 2026-10-29); the umich.edu domain except Dearborn's old umd.umich.edu; 'UMich'; 'Michigan Medicine'. Never a bare 'Ann
# Arbor' (Toyota Research Institute, NEC, Ford and others sit there) and never 'Michigan' alone (Michigan State,
# Michigan Tech, Western / Eastern / Central Michigan).
regex = '''univ\w*\.?\s+(?:of\s+)?mich(?:igan)?\b(?![\s,]*(?:[-–—]\s*|at\s+|in\s+)?(?:dearborn|flint|shanghai|sjtu)\b)|(?<!umd\.)umich\.edu|\bumich\b(?!\.edu)|\bmichigan\s+medicine\b'''
own_units = '''\bmichigan\s+institute\s+for\s+(?:data\s+(?:science|and\s+ai\s+in\s+society)|computational\s+discovery(?:\s+(?:and|&)\s+engineering)?|clinical\s+(?:and|&)\s+health\s+research)\b|\binstitute\s+for\s+social\s+research\b|\blife\s+sciences\s+institute\b|\bmichigan\s+(?:robotics|neuroscience)\s+institute\b|\binstitute\s+for\s+healthcare\s+policy\s+(?:and|&)\s+innovation\b|\brobotics\s+institute\b'''
loose = '''univ\w*\.?\s+(?:of\s+)?mich|\bumich\b|umich\.edu|ann\s+arbor'''   # page-1 'any mention' (pi_hierarchy.SCHOOL_LOOSE)
must_match = [
  "University of Michigan, Ann Arbor, MI 48109, USA",
  "Computer Science and Engineering, University of Michigan",
  "Univ. of Michigan",
  "University of Michigan–Ann Arbor",
  "Univ Mich, Dept EECS",
  "University Michigan",
  "Department of Computational Medicine and Bioinformatics, Michigan Medicine",
  "jdoe@umich.edu",
  "UMich",
  "University of Michigan Medical School, Ann Arbor",
]
must_not_match = [
  "University of Michigan-Dearborn",
  "University of Michigan – Flint",
  "University of Michigan, Dearborn, MI",
  "University of Michigan Flint",
  "Michigan State University",
  "Western Michigan University",
  "Michigan Technological University",
  "Eastern Michigan University",
  "jdoe@umd.umich.edu",
  "Toyota Research Institute, Ann Arbor, MI",
  "University of Michigan-Dearborn, Dearborn, MI 48128",
  "University of Michigan at Dearborn, Industrial and Manufacturing Systems Engineering, MI, USA",
  "University of Michigan - Shanghai Jiao Tong University Joint Institute, Shanghai, China",
  "University of Michigan-Shanghai Jiao Tong University, UM-SJTU Joint Institute",
]

[dblp]
# DBLP <note type="affiliation"> values are matched with [affiliation].regex (dump only; dblp.org is never fetched)
affiliation_strings = ["University of Michigan"]
legacy_sweep = ""

[rules]
foreign_title_exception = false

[census]
computing_departments = ["CSE", "ECE"]
# canonical home-unit names: the listings spell units several ways (tools/home_departments_school.py)
home_units = {"Computer Science and Engineering" = '^(?:EECS\s*[\u2013-]\s*)?Computer Science (?:and|&) Engineering$', "Electrical and Computer Engineering" = '^(?:EECS\s*[\u2013-]\s*)?Electrical (?:and|&) Computer Engineering$', "Linguistics" = '^Lin[gq]uistics$', "Robotics" = '^Robotics(?: Department)?$', "Nuclear Engineering and Radiological Sciences" = 'Nuclear Engineering (?:and|&) Radiological', "Industrial and Operations Engineering" = 'Industrial (?:and|&) Operations', "Civil and Environmental Engineering" = 'Civil (?:and|&) Environmental', "School of Information" = '^(?:School of )?Information$|^School of Information', "Statistics" = '^Statistics$', "Mathematics" = '^Mathematics$', "Mechanical Engineering" = '^Mechanical Engineering$'}

[site]
depts = {CSE = "Computer Science and Engineering", ECE = "Electrical and Computer Engineering"}
full_codes = ["CSE"]

# --- departments -------------------------------------------------------------------------------------------------
# Both are divisions of Electrical Engineering and Computer Science (EECS), College of Engineering. The live
# cse.engin.umich.edu and ece.engin.umich.edu serve a Cloudflare challenge (2026-10-29), so both are Wayback-only.
[[departments]]
code = "CSE"
name = "Computer Science and Engineering"
unit = "Electrical Engineering and Computer Science, College of Engineering"
title_match = '''Electrical Engineering (?:and|&) Computer Science|Computer Science (?:and|&) Engineering|\bEECS\b'''   # the title lines that are the department appointment
coverage = "full"
url = "https://cse.engin.umich.edu/"
  # one slot, three URL eras (CDX 2026-10-29): the EECS site's CSE list (also mirrored at cse.umich.edu) until 2019,
  # then the CSE WordPress 'All Faculty' page (tenure-track, teaching, research, courtesy and emeritus faculty in one
  # list, each with the title as listed)
  [[departments.listings]]
  slot = "CSE all faculty"
  kind = "main"
  url = "eecs.umich.edu/eecs/faculty/csefaculty.html"
  from = "20160101"
  to = "20191231"
  [[departments.listings]]
  slot = "CSE all faculty"
  url = "cse.umich.edu/eecs/faculty/csefaculty.html"
  from = "20160101"
  to = "20191231"
  [[departments.listings]]
  slot = "CSE all faculty"
  url = "cse.engin.umich.edu/people/faculty/"
  from = "20190901"
  to = "20261231"
  [[departments.listings]]
  slot = "CSE emeritus faculty"
  kind = "emeritus"
  url = "cse.engin.umich.edu/people/faculty/emeritus-faculty/"
  from = "20190901"
  to = "20261231"

[[departments]]
code = "ECE"
name = "Electrical and Computer Engineering"
unit = "Electrical Engineering and Computer Science, College of Engineering"
title_match = '''Electrical Engineering (?:and|&) Computer Science|Electrical (?:and|&) Computer Engineering|\bEECS\b'''
coverage = "affiliated"   # as Stanford EE: listed faculty count when computing is the object or method of their work
url = "https://ece.engin.umich.edu/"
  [[departments.listings]]
  slot = "ECE all faculty"
  kind = "main"
  url = "eecs.umich.edu/eecs/faculty/ecefaculty.html"
  from = "20160101"
  to = "20191231"
  [[departments.listings]]
  slot = "ECE all faculty"
  url = "ece.engin.umich.edu/people/faculty/"
  from = "20190901"
  to = "20201231"
  [[departments.listings]]
  slot = "ECE all faculty"
  url = "ece.engin.umich.edu/people/directory/faculty/"
  from = "20200101"
  to = "20261231"

