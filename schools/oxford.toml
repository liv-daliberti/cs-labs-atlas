[thesis]
kind = "datacite"
base_url = "https://ora.ox.ac.uk/"
endpoints = []
robots = "unreachable"
note = "Pending host and endpoint verification. Collect explicit thesis supervisor statements only; repository authorship alone is not advising."
[collector]
# 2026-11-10 (owner): discovery channels re-enabled for every loop. wayback_acm stays OFF (and WAYBACK_HOLD=1 in the loop scripts) while Wayback listing captures run; CORE stays paused.
# Re-enable wayback_acm later: append "wayback_acm" here and set WAYBACK_HOLD=0 for the loops. OpenAlex spend is capped by OA_RESERVE=4000 (docs/CHANNELS.md).
channels = ["oa_arxiv", "openalex", "proceedings", "arxiv_title", "dblp_ee", "s2", "europepmc", "pmc", "figshare", "labpages", "pihomes"]
[students]
directories = []
adviser_directories = []
defense_lists = []
adviser_alumni = []
rosters = []
sources = ["thesis repository with explicit supervisor metadata", "dated official defence and graduation lists", "PI-owned lab member and alumni pages"]
[labpages]
skip_pages = []
hints = ["https://www.cs.ox.ac.uk/people/faculty.html", "https://www.cs.ox.ac.uk/research/", "https://eng.ox.ac.uk/research/"]
[repository]
name = "Oxford University Research Archive (through permitted repository metadata, OpenAlex and CORE)"
pattern = 'ora\.ox\.ac\.uk'
[store]
path = "stores/oxford"

