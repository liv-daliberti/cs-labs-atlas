# University-wide discovery; full computing department, affiliated review elsewhere.
# Legacy site inventories are discovery leads, never accepted PI/paper links without current attribution checks.
key = "oxford"
name = "University of Oxford"
short = "Oxford"
site_uni = "university-of-oxford"
status = "released"
order = 13
stage = 0
started = "2026-11-06"
window = [2016, 2026]

[ids]
openalex = ["I40120149"]
openalex_related = []
openalex_excluded = ["I2802626578", "I4210162602"]
ror = "https://ror.org/052gg0110"
ids_note = "Verified local OpenAlex institutions snapshot and lineage, plus official ROR v2 API (HTTP200), 2026-11-06. Sweep all university lineage children except publishing companies. Related hospitals and trusts are not automatically university appointments; no related-only expansion initially. Every PI still needs a faculty appointment and computing scope. Colleges alone establish neither university employment nor lab membership."

[web]
domains = ["ox.ac.uk"]
email_domains = ["ox.ac.uk"]
wayback_only_suffixes = []
excluded_hosts = []

[affiliation]
regex = '\b(?:university\s+of\s+oxford|oxford\s+univ(?:ersity)?\.?)(?!\s+press)\b|\b(?:[\w-]+\.)*ox\.ac\.uk\b'
loose = 'oxford|ox\.ac\.uk'
own_units = ''
must_match = ["University of Oxford, United Kingdom", "Oxford University, UK", "Department of Computer Science, University of Oxford", "person@ox.ac.uk"]
must_not_match = ["Oxford University Press", "Oxford College, USA", "Oxford Brookes University", "Harvard University, Cambridge, MA", "Miami University, Oxford, Ohio"]

[dblp]
affiliation_strings = ["University of Oxford", "Oxford University"]
legacy_sweep = ""

[census]
computing_departments = ["CS"]
center_units = ["BDI", "OERC"]
home_units = { "Computer Science" = 'computer science' }
rank_words = { ladder = '\b(?:reader|senior lecturer|university lecturer)\b' }

[sweep_check]
exceptions = []
[cs_related]
not_faculty = {}
share_test_settles = []
[site]
depts = { CS = "Computer Science" }
full_codes = ["CS"]
[periods]
school_regex = '\b(?:university\s+of\s+oxford|oxford\s+univ(?:ersity)?\.?)(?!\s+press)\b|\b(?:[\w-]+\.)*ox\.ac\.uk\b'
[rules]
foreign_title_exception = false
listing_continuity = false

[[departments]]
code = "CS"
name = "Computer Science"
unit = "Department of Computer Science"
title_match = 'computer science|computer laboratory'
coverage = "full"
url = "https://www.cs.ox.ac.uk/people/faculty.html"
  [[departments.listings]]
  slot = "main"
  kind = "main"
  url = "www.cs.ox.ac.uk/people/faculty.html"
  from = "20160101"
  to = "20261231"
  prefix = false
  match = ""
  format = "oxford_person_index"
  title_filter = ''

[[affiliated_units]]
code = "ENG"
name = "Engineering Science"
url = "https://eng.ox.ac.uk/people?c=ac"
listings = ["eng.ox.ac.uk/people?c=ac"]

[[affiliated_units]]
code = "STAT"
name = "Statistics"
url = "https://www.stats.ox.ac.uk/people"
listings = ["www.stats.ox.ac.uk/people"]

[[affiliated_units]]
code = "MATH"
name = "Mathematical Institute"
url = "https://www.maths.ox.ac.uk/people"
listings = ["www.maths.ox.ac.uk/people"]

[[affiliated_units]]
