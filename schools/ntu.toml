ids_note = "The indexed local snapshot original compact BLOB for I172675005 binds Nanyang Technological University/SG/ROR02e7b5302/homepagehttps://www.ntu.edu.sg. Actual compressed and decoded bytes/SQLprimarykeys are preserved in scratch/ntu-next-chain-1108/institution25-original-indexed-records.json; these are local snapshot records, not original ROR/OpenAlex HTTP. NIE and UMI MajuLab are recorded children; SMART is recorded related. Proposed conservative related treatment requires independent explicit raw primary-university affiliation or reviewed joint appointment, never inherited lineage alone; it is not a legal ownership assertion. National Taiwan University/TW/I16733864 and Nottingham Trent University/GB/I52590639 are distinct indexed institutions. Genuine primary NTU dual affiliations are preserved. No Singapore NTU campus is excluded. Campus/university-wide unit and host readiness remains partial; no sweep/native/collector is authorized by this charter alone."

