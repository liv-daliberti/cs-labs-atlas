# Institutional-repository harvest (fulltext-push/oai_repo.py; verdicts in docs/CHANNELS.md, "Repository harvests", 2026-11-04)
[oai_repo]
verdict = "harvest"
repository = "UChicago Knowledge (InvenioRDM)"
base = "https://knowledge.uchicago.edu/oai2d"   # robots.txt: Disallow /search /api /administration ...; /oai2d is not disallowed (checked 2026-11-04); Crawl-delay 10; no AI-agent rules
prefix = "oai_dc"
delay = 10
landing = "https://knowledge.uchicago.edu/records/{id}"   # the OAI identifier's tail is the record id; oai_dc carries no file URLs, the collector reads citation_pdf_url from the record page

# Dissertation record pages for the adviser field (fulltext-push/etd_crawl.py; owner 2026-11-04). oai_dc has no contributors; the record page names 'Advisor:'.
# The queue is the OAI harvest's doctoralThesis records (every community: the [oai_repo] harvest above has no set filter), not the whole 16k-record sitemap.
# robots.txt: Disallow /search /api /records/*/preview, Crawl-delay 10.
[etd_crawl]
host = "knowledge.uchicago.edu"
delay = 10
enumerate = "oai"
oai_type_rx = "doctoralThesis"
parser = "invenio"

[collector]
# 2026-11-10 (owner): discovery channels re-enabled for every loop. wayback_acm stays OFF (and WAYBACK_HOLD=1 in the loop scripts) while Wayback listing captures run; CORE is allowed everywhere (DECISIONS 2026-11-15): core and core_bulk added to the list 2026-11-16.
# Re-enable wayback_acm later: append "wayback_acm" here and set WAYBACK_HOLD=0 for the loops. OpenAlex spend is capped by OA_RESERVE=4000 (docs/CHANNELS.md).
channels = ["oa_arxiv", "openalex", "proceedings", "arxiv_title", "dblp_ee", "s2", "core", "core_bulk", "europepmc", "pmc", "figshare", "labpages", "pihomes"]
