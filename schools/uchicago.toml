  to = "20170120"
  [[departments.listings]]
  slot = "TTIC faculty"
  url = "www.ttic.edu/faculty/"
  from = "20170121"
  to = "20261231"

[[departments]]
code = "STAT"
name = "Statistics"
unit = "Physical Sciences Division"
title_match = '''Statistics'''
coverage = "affiliated"   # listed faculty count when computing is the object or method of their work (stage 2)
