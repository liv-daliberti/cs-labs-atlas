# --- students ----------------------------------------------------------------------------------------------------
[thesis]
kind = "none"
base_url = "https://knowledge.uchicago.edu/"
endpoints = []
robots = "allowed"
note = """Knowledge@UChicago (InvenioRDM). robots.txt 2026-11-03: '*' only, no AI-agent rules, Crawl-delay 10, Disallow /search /api /administration /uploads. It is allowed but not usable: the only listing is the sitemap (16,089 record pages) and
search and API are disallowed, so reading the advisor field means one record page per 10 s (about 45 hours) with no way to select computer-science dissertations. Skipped (stage 6, 2026-11-03); students come from the TTIC adviser list, lab pages and the PIs' own pages."""

[students]
