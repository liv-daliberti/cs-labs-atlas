[thesis]
kind = "none"
base_url = "https://repository.library.washu.edu/"
endpoints = []
robots = "allowed"
note = """WashU Scholarly Repository (formerly Open Scholarship; bepress Digital Commons; openscholarship.wustl.edu 301s to repository.library.washu.edu). robots.txt 2026-11-05: '*' group only (two named scanner agents allowed, '^Byte' disallowed), no AI-agent rules, NO Crawl-delay; Disallow /do/ (so the OAI-PMH endpoint /do/oai/ is closed to us) and the /cgi/ scripts; record pages and sitemaps allowed.
ETD records by sitemap: eng_etds 1,366, art_sci_etds 3,472 (the /etd/ umbrella sitemap lists only ~1,180). At our own courtesy delay of 10 s that is 3.8 h for Engineering, 13.4 h with Arts & Sciences.
Not yet classed usable: stage 6 decides by a 20-record pilot of whether the record page carries an advisor line."""

