# schools/washu.toml: Washington University in St. Louis (charter; docs/ADDING-A-SCHOOL.md stage 0, protocol v3). Filled 2026-11-05.
# Owner decision 2026-11-05 (coordinator relay): keep ONLY labs that do computing. No blanket keep or drop of the School of Medicine, Barnes-Jewish, St. Louis Children's, Siteman, Olin or any other unit: a unit counts only through its computing labs, i.e. faculty who meet the CS-related scope rule (docs/RULES.md; DBLP-indexed / CS-venue work, e.g. I2DB, biostatistics and informatics faculty who publish in CS venues). Non-computing labs are out. Affiliation strings of those units may stay in `loose` / `own_units` so papers of in-scope PIs who list them are credited; they never add PIs or labs. A PI is a faculty member of the school. The look-alike exclusions are identity, not scope, and always apply.

key = "washu"
name = "Washington University in St. Louis"
short = "WashU"
site_uni = "washington-university-in-st-louis"
status = "released"
order = 12
stage = 9
started = "2026-11-05"
window = [2016, 2026]

[ids]
openalex = ["I204465549"]
# Owner decisions 2026-11-05, all as recommended (hierarchy/washu/reports/STAGE-0.md): D1 the four lineage children are swept (Physicians, Tyson, Taylor Family Institute, Children's Discovery Institute);
# D2 related = Barnes-Jewish, St. Louis Children's, Siteman, WU Medical Center, Musculoskeletal Research Center (regex-only: an authorship tagged only with these counts when its raw string matches the regex); Central Institute for the Deaf stays unswept;
# D3 excluded = Taylor Geospatial Institute, Washington University of Virginia; D4 the School of Law matches (out of computing scope anyway); D5 CSE is the department, ESE and BME affiliated departments, the rest affiliated units under the CS-related rule;
# D6 [thesis] stays kind = none until a 20-record pilot in stage 6 shows advisor lines.
openalex_related = ["I1299725459", "I1324021844", "I4390039355", "I4210135078", "I4405268834"]
openalex_excluded = ["I4402554118", "I4405285522"]   # Taylor Geospatial Institute (multi-university consortium); Washington University of Virginia (a different institution)
ror = "https://ror.org/01yc7t268"
ids_note = """OpenAlex institutions table of the filtered snapshot (no API credits; checked 2026-11-05): I204465549 'Washington University in St. Louis', ROR 01yc7t268, US, lineage [I204465549] (no parent).
Lineage children: Washington University Physicians I4387155636, Tyson Research Center I4405285149, Taylor Family Institute for Innovative Psychiatric Research I4392738227, Children's Discovery Institute I4210122064.
Associated, not lineage: Barnes-Jewish Hospital I1299725459 (ROR 04wyvkr12; BJC HealthCare I1328499231 is its parent), St. Louis Children's Hospital I1324021844 (00qw1qw03), Alvin J. Siteman Cancer Center I4390039355 (03jrmgg47,
lineage holds Barnes-Jewish and BJC), Washington University Medical Center I4210135078 (036c27j91), Central Institute for the Deaf I2802002475, Taylor Geospatial Institute I4402554118 (consortium).
Musculoskeletal Research Center, Washington University in St. Louis I4405268834 has its own lineage (a WashU unit recorded as a separate institution). There is no separate institution for the School of Medicine:
its authorships carry the university id. Look-alikes with their own lineages (never WashU): Washington University of Virginia I4405285522, George Washington University I193531525, Central/Eastern/Western Washington
University, Trinity Washington University. ROR relationships still to verify at api.ror.org/v2/organizations/01yc7t268 (no network lookup made in this run)."""

