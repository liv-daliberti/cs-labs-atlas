# schools/hit.toml: charter for Harbin Institute of Technology (docs/ADDING-A-SCHOOL.md, stage 0). Top-25 push 2026-11-07 (GRAS 2025 CSE rank 24).
# Facts in this file are decisions about where to look, not evidence. Chinese official pages are the primary source; quotes stay in the original script.

key = "hit"
name = "Harbin Institute of Technology"
short = "HIT"
site_uni = ""
status = "onboarding"
order = 17
stage = 0
started = "2026-11-07"
window = [2016, 2026]

[ids]
# Owner approved the boundaries below 2026-11-11; see docs/STAGE0-COHORT-20261111.md.
openalex = ["I204983213"]
openalex_related = []
openalex_excluded = []
ror = "https://ror.org/01yqg2h08"
ids_note = "OpenAlex institutions table of the local snapshot (no API credits, 2026-11-07): I204983213 'Harbin Institute of Technology', ROR 01yqg2h08, CN, lineage [I204983213]. Only 3 State Key Laboratories are children (Robotics and Systems, Urban Water Resources, Advanced Welding). OpenAlex has NO separate institution for the Shenzhen (hitsz.edu.cn) or Weihai (hitwh.edu.cn) campuses: searches for them return nothing, so their papers carry I204983213; the regex therefore matches the Shenzhen and Weihai campuses by name (owner decision D2). Not the Harbin Engineering University, Harbin University of Science and Technology, Harbin Medical University (must_not_match)."

[web]
domains = ["hit.edu.cn", "hitsz.edu.cn", "hitwh.edu.cn"]
email_domains = ["hit.edu.cn", "hitsz.edu.cn", "hitwh.edu.cn"]
wayback_only_suffixes = []
excluded_hosts = []

[affiliation]
regex = '''\bharbin\s+inst\w*\.?\s+of\s+tech\w*|哈尔滨工业大学|哈工大|\bhit\.edu\.cn\b|\bhitsz\.edu\.cn\b|\bhitwh\.edu\.cn\b|\bschool\s+of\s+computer\s+science\s+and\s+technology,?\s+harbin\s+inst'''
loose = '''harbin\w*|哈尔滨|\bhit\b(?:\s+shenzhen)?|\bhitsz\b'''
own_units = '''\bfaculty\s+of\s+computing\b|\bresearch\s+center\s+for\s+social\s+computing\s+and\s+information\s+retrieval\b|\bpeng\s+cheng\s+laboratory\b'''
must_match = ["School of Computer Science and Technology, Harbin Institute of Technology, Harbin 150001, China", "Harbin Institute of Technology, Shenzhen, China", "Harbin Institute of Technology (Shenzhen)", "Harbin Institute of Technology at Weihai", "Faculty of Computing, Harbin Institute of Technology", "哈尔滨工业大学计算学部", "jdoe@hit.edu.cn", "jdoe@stu.hit.edu.cn", "Harbin Inst. of Technology, Harbin"]
must_not_match = ["Harbin Engineering University", "Harbin University of Science and Technology", "Harbin Medical University", "Harbin Normal University", "Heilongjiang University, Harbin", "Northeast Forestry University, Harbin", "Holon Institute of Technology, Israel", "Shenzhen Institute of Advanced Technology", "jdoe@hrbeu.edu.cn"]

[dblp]
affiliation_strings = ["Harbin Institute of Technology"]
legacy_sweep = ""

[census]
computing_departments = ["CS", "SW"]
center_units = []
home_units = {}
# Chinese titles; \\b is not used (CJK counts as a word character). 教授 professor (副教授 associate, 助理教授 assistant), 研究员 research-track, 讲师 lecturer.
rank_words = {ladder = '教授', lecturer = '讲师|助教', research = '研究员', emeritus = '荣休|退休|名誉', adjunct = '兼职', visiting = '客座'}

[sweep_check]
exceptions = []

[cs_related]
not_faculty = {}
share_test_settles = []

[site]
depts = {"CS" = "School of Computer Science and Technology (Faculty of Computing)", "SW" = "School of Software"}
full_codes = ["CS"]

[periods]
school_regex = ''

[rules]
foreign_title_exception = false
listing_continuity = false

[[departments]]
code = "CS"
name = "School of Computer Science and Technology (计算机科学与技术学院)"
unit = "Faculty of Computing, Harbin Institute of Technology"
title_match = '教授|研究员|讲师'
coverage = "full"
url = "http://cs.hit.edu.cn/jsml/list.htm"
  [[departments.listings]]
  slot = "CS all teachers 2018-2019"
  kind = "main"
  url = "cs.hit.edu.cn/8554/list.htm"
  from = "20171201"
  to = "20190430"
  format = "hit_teacher_list"
  [[departments.listings]]
  slot = "CS current faculty"
  kind = "main"
  url = "cs.hit.edu.cn/jsml/list.htm"
  from = "20251201"
  to = "20261231"
  format = "hit_cs_current_table"

[[affiliated_units]]
code = "SW"
name = "School of Software (软件学院)"
url = "http://software.hit.edu.cn/"
listings = ["software.hit.edu.cn/"]

[[affiliated_units]]
code = "HOME"
name = "HIT faculty homepage system (教师主页, covers Harbin and Shenzhen)"
url = "https://homepage.hit.edu.cn/home-index"
listings = ["homepage.hit.edu.cn/home-index"]

[thesis]
kind = "none"
base_url = ""
endpoints = []
robots = "unreachable"
note = "HIT theses are on campus or CNKI/Wanfang (paywalled): not used. Reached only through OpenAlex metadata."

[collector]
# 2026-11-18 (owner, "let's keep going"): standard onboarding download channels like Purdue (bbd04047); CORE is allowed everywhere (DECISIONS 2026-11-15). No wayback.
channels = ["oa_arxiv", "openalex", "s2", "core", "core_bulk", "europepmc", "pmc", "labpages"]
[students]
directories = []
adviser_directories = []
defense_lists = []
adviser_alumni = []
rosters = []
sources = ["lab member pages and PI homepages (live where robots allows, else Wayback)", "OpenAlex / CORE thesis metadata only (CNKI and Wanfang are paywalled; never used)"]

[labpages]
skip_pages = []
hints = ["<lab>.hit.edu.cn", "homepage.hit.edu.cn/<name>", "ir.hit.edu.cn", "<name>.github.io"]

[repository]
name = "HIT institutional repository (never asked); reached through OpenAlex and CORE"
pattern = '''thesis\.hit\.edu\.cn|Harbin Institute of Technology Library|cnki\.net'''

[store]
path = "/n/fs/resemble/homogenizing-science/stores/hit"

