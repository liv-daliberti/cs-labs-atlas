# Princeton University: released before protocol v1 (built 2026-10-17..27). Only the fields the released build and the
# shared tools read are filled; the stage-tool fields (listing slots, hosts) live in that school's own sweep code.
key = "princeton"
name = "Princeton University"
short = "Princeton"
site_uni = "princeton-university"
status = "released"
order = 1
stage = 10
legacy = true
window = [2016, 2026]

[ids]
openalex = ["I20089843"]
openalex_related = []
ror = "https://ror.org/00hx57361"
ids_note = "OpenAlex /institutions?filter=openalex_id 2026-10-29: display name and ROR as here"

[web]
domains = ["princeton.edu"]

[affiliation]
regex = 'princeton\s+univ|univ\w*\.?\s+(?:of\s+)?princeton|princeton\.edu'
own_units = ''
loose = 'princeton'          # pi_hierarchy.SCHOOL_LOOSE: any mention of the school on page 1
must_match = []
must_not_match = []

[dblp]
affiliation_strings = []
legacy_sweep = ""

[rules]
foreign_title_exception = false

[census]
computing_departments = ["Computer Science"]   # listed_not_in_census.py; [] = every listed department

[site]
depts = {}

# Institutional-repository harvest (fulltext-push/oai_repo.py; verdicts in docs/CHANNELS.md, "Repository harvests", 2026-11-04)
[oai_repo]
verdict = "skip"
repository = "Princeton OAR (oar.princeton.edu, DSpace 5 JSPUI)"
reason = "no OAI-PMH endpoint: /oai/request and /jspui/oai/request answer 404 (checked 2026-11-04); robots.txt allows the item pages and lists a sitemap, which the earlier OAR item index (cs-structure/raw/oar, matched by the oar channel) already used. No ClaudeBot/anthropic-ai rule."

[collector]
# 2026-11-10: only the download loop plus cheap open-access channels (no openalex/s2: shared 10k-credit/day OpenAlex key; no wayback_acm: one Wayback fetcher at a time). Widen later by adding channel names from fulltext-push/channels/; applies at the next 59-min restart unless CHANNELS is set in the environment (the 2026-11-10 restarts set it).
channels = ["oa_arxiv", "europepmc", "pmc"]
