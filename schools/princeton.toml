# Princeton University: released before protocol v1 (built 2026-10-17..27). Only the fields the released build and the
# shared tools read are filled; the stage-tool fields (listing slots, hosts) live in that school's own sweep code.
key = "princeton"
name = "Princeton University"
short = "Princeton"
site_uni = "princeton-university"
status = "released"
order = 1
stage = 10
legacy = true
window = [2016, 2026]

[ids]
openalex = ["I20089843"]
openalex_related = []
ror = "https://ror.org/00hx57361"
ids_note = "OpenAlex /institutions?filter=openalex_id 2026-10-29: display name and ROR as here"

[web]
domains = ["princeton.edu"]

[affiliation]
regex = 'princeton\s+univ|univ\w*\.?\s+(?:of\s+)?princeton|princeton\.edu'
own_units = ''
loose = 'princeton'          # pi_hierarchy.SCHOOL_LOOSE: any mention of the school on page 1
must_match = []
must_not_match = []

[dblp]
affiliation_strings = []
legacy_sweep = ""

[rules]
foreign_title_exception = false

[census]
computing_departments = ["Computer Science"]   # listed_not_in_census.py; [] = every listed department
home_units = {"Electrical and Computer Engineering" = '^Electrical and Computer Engineering$', "Operations Research and Financial Engineering" = '^Operations Research and Financial Engineering$', "Mathematics" = '^Mathematics$', "Mechanical and Aerospace Engineering" = '^Mechanical and Aerospace Engineering$', "Psychology" = '^Psychology$', "Sociology" = '^Sociology$', "Molecular Biology" = '^Molecular Biology$', "Architecture" = '^Architecture$', "Music" = '^Music$', "Ecology and Evolutionary Biology" = '^Ecology and Evolutionary Biology$', "Economics" = '^Economics$', "Chemical and Biological Engineering" = '^Chemical and Biological Engineering$'}

[[departments]]
code = "CS"
name = "Computer Science"
unit = "School of Engineering and Applied Science"
title_match = 'Professor|Lecturer|Research Scholar'
coverage = "full"
url = "https://www.cs.princeton.edu/people/faculty"
  [[departments.listings]]
  slot = "CS faculty"
  kind = "main"
  url = "www.cs.princeton.edu/people/faculty"
  from = "20160101"
  to = "20261231"
  format = "princeton_cs_faculty"

[site]
depts = {}

# Institutional-repository harvest (fulltext-push/oai_repo.py; verdicts in docs/CHANNELS.md, "Repository harvests", 2026-11-04)
[oai_repo]
verdict = "skip"
repository = "Princeton OAR (oar.princeton.edu, DSpace 5 JSPUI)"
reason = "no OAI-PMH endpoint: /oai/request and /jspui/oai/request answer 404 (checked 2026-11-04); robots.txt allows the item pages and lists a sitemap, which the earlier OAR item index (cs-structure/raw/oar, matched by the oar channel) already used. No ClaudeBot/anthropic-ai rule."

# Hosts the princeton tools contact (stage 0, 2026-11-10). Derived from evidence: the raw capture stores (hierarchy/princeton/raw/*captures*.sqlite) and the full-text download ledger (stores/princeton/fulltext_assets.csv). The long tail of faculty personal sites is read per capture under school_web robots checks and is not enumerated here.
[[hosts]]
host = "web.archive.org"
use = "live"
purpose = "Wayback id_ captures and CDX (listings 2016-2026, lab pages) [stage 0 2026-11-10: probe skipped: https://web.archive.org/web/2020id_/https://www.princeton.edu/ answers http 302 (redirect to the nearest snapshot); entry otherwise as in the Michigan and Harvard charters]"
