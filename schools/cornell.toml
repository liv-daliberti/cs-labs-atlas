ids_note = """Verified 2026-11-24 against the local OpenAlex institutions snapshot (tools/oa_institutions.py search 'Cornell' and lineage I205783295): I205783295 'Cornell University', ROR 05bnh6r87, US, education, no parent. The live ROR API was not queried; the ROR id is the snapshot's.
