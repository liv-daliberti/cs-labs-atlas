Lineage children excluded (D-0057): PARADIM I4387152773 (shared lineage with JHU), New York Sea Grant I4210134430, New York Space Grant Consortium I4210141610. Weill Cornell Medical College in Qatar I4210152471 is 'related' in OpenAlex, not a child; excluded by name (qatar-med.cornell.edu, excluded_regex).
Related, regex-only (D-0057): Weill Cornell Medical Center I4405272987 (a lineage child in OpenAlex; listing it in openalex_related makes the snapshot filter gate it by the affiliation regex, as UCSD does for UC San Diego Health) and NewYork-Presbyterian Hospital I1340179700. They credit papers of in-scope Cornell computing PIs and never add a PI.
Not Cornell and never swept: Memorial Sloan Kettering I1334819555, The Rogosin Institute I49181423, Houston Methodist I1295876152, Burke Rehabilitation Hospital I2800750008 and Burke Medical Research Institute I4210117944, Lincoln Medical Center, Lower Manhattan Hospital, Morgan Stanley Children's, NewYork-Presbyterian Brooklyn Methodist, Wyckoff Heights, New York Hospital Queens (all 'related' associates), Museum of the Earth I4210132207, Paleontological Research Institution I4405279340, Hubbard Brook LTER I4387152556, Great Lakes Research Consortium I4392738241. Not in the lineage and not named in D-0057, left out: Cornell High Energy Synchrotron Source I4387153242 and Cornell Feline Health Center I4405270756 (papers of in-scope PIs still credit through 'Cornell University' strings).
Look-alikes kept out: Cornell College I145220665 (Iowa), Cornell Scott-Hill Health Center I4210151875 (New Haven), the county Cornell Cooperative Extension associations (I4210160768, I4210161778, I4210154575, others), Cornell Douglas Foundation, Emil och Wera Cornells Stiftelse.
D-0057 also names the Hospital for Special Surgery, which is not in the lineage output: not swept, not in any list."""

