# schools/<key>.toml: one school's charter (docs/ADDING-A-SCHOOL.md, stage 0). Copy this file to schools/<key>.toml,
# fill every field, run `python tools/school_config.py --check <key>` and `python tools/school_hosts.py <key>`, then
# commit it. Every stage tool reads the school from here; nothing else needs a school list (see the protocol's
# "files that must learn a new school" for the few that still do).
#
# Facts in this file are decisions about where to look, not evidence: evidence (url + sha256 + verbatim quote) lives in
# the captures and the stage outputs. Say how each identifier was verified in the *_note fields.

key = "nyu"                  # lower-case, [a-z0-9]+; the folder name everywhere (hierarchy/<key>, stores/<key>, schools/<key>)
name = "New York University"                 # full official name ("University of Michigan")
short = "NYU"                # display name ("Michigan")
site_uni = "new-york-university"             # the 300-university atlas id (SITE_DATA/universities/<site_uni>.json.gz), if any
status = "onboarding"     # onboarding | released. Only released schools are in atlas_paths.SCHOOL_IDS (the build,
                          # the release, the tree); flip it at stage 10, never earlier
order = 36                 # display and build order (released schools are listed in this order)
stage = 0                 # the last stage whose gate passed (hierarchy/<key>/STAGE-<n>.md)
started = "2026-11-24"              # YYYY-MM-DD the onboarding started
window = [2016, 2026]     # the study window (owner rule; do not change per school)

[ids]
openalex = ["I57206974", "I36672615", "I4405267893"]
openalex_related = ["I4210086933", "I4210163050", "I42102869"]
openalex_excluded = ["I120250893", "I258800397", "I4210165353", "I4210123063", "I2799442855"]
ror = "https://ror.org/0190ak572"
ids_note = """Verified 2026-11-24 against the local OpenAlex institutions snapshot (bin/atlas run tools/oa_institutions.py search 'New York' --country US and lineage I57206974): I57206974 'New York University', ROR 0190ak572, US, education, no parent; lineage = itself plus 7 children. The ROR id is the snapshot's; the live ROR API was not queried in this run. Owner scope D-0058 (2026-11-24): New York campus only; GRAS 2025 CS&E band 51-75.
Kept: I57206974 (Washington Square, Center for Data Science, Tandon / Brooklyn, Grossman School of Medicine) including its child Courant Institute of Mathematical Sciences I36672615 and NYU Grossman Long Island School of Medicine I4405267893 (a lineage child, NYU; medicine faculty count only under the CS-related rule, D-0039 D2 / D-0053). Tandon School of Engineering has no OpenAlex institution of its own: it is the former Polytechnic Institute of NYU / Polytechnic Institute of New York University (poly.edu until 2014), so its authorships carry I57206974 or only the raw string, and the regex names Tandon and the Polytechnic Institute of New York University explicitly.
Lineage children excluded (as D-0014; their faculty count only through a New York appointment): NYU Abu Dhabi I120250893, NYU Shanghai I258800397, NYU Paris I4210165353, NYU Florence I4210123063, NYU Press I2799442855.
Related, regex-only (D-0058; OpenAlex 'related' associations, not children, so the snapshot filter sweeps them and gates their authorships by the affiliation regex): NYU Langone Health I4210086933, NYU Langone Orthopedic Hospital I4210163050, Rusk Rehabilitation I42102869. They credit papers of in-scope PIs and never add a PI.
Not NYU and never swept: Bellevue Hospital Center I4210108985, VA NY Harbor Healthcare System I2800015068, Brookdale University Hospital I2802707398, Coleridge Initiative I4210160702 (all 'related' associations in OpenAlex, not NYU). Flatiron Institute I4387153999 (Simons Foundation) is a separate institution: never swept, never adds a PI; a joint person is admitted only through an NYU appointment and a paper credits only where the author's own byline names NYU (R-PAP-40); flatironinstitute.org and simonsfoundation.org are excluded hosts and its names are in excluded_regex.
Look-alikes that must not match (other lineages): SUNY ('State University of New York'), CUNY, New York Institute of Technology, New York Medical College, NewYork-Presbyterian, York University (Toronto).
children-counts returns 0 works for every NYU child (checked 2026-11-24 with oa_institutions.py children-counts); that is a property of the snapshot's per-institution works_count for these ids, not evidence of no works, and it did not block the charter."""

