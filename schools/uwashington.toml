[thesis]
kind = "none"
base_url = "https://digital.lib.washington.edu/"
endpoints = []
robots = "disallowed-for-ai-agents"
note = """ResearchWorks Archive (digital.lib.washington.edu, DSpace). Its robots.txt (2026-11-07) has a group 'User-agent: anthropic-ai / Disallow: /': this project's fetchers are Claude agents, so the host is not used in any form, not through Wayback either.
Its holdings (UW theses and dissertations) reach us only through OpenAlex and CORE (CORE is paused). Students therefore come from lab pages, PhD graduation lists and the Allen School's own pages, stage 6."""

