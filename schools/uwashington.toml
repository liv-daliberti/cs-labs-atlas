# schools/uwashington.toml: University of Washington, Seattle (charter; docs/ADDING-A-SCHOOL.md stage 0, protocol v3). Filled 2026-11-07.
# Owner scope (2026-11-07, via the coordinator): ONLY labs that do computing. The Paul G. Allen School of Computer Science & Engineering first, then the
# computing-heavy units of other departments (ECE, the Information School, Statistics, Applied Math, HCDE, and BioE / Genome Sciences only for computational
# faculty) under the CS-related rule (docs/RULES.md). A unit's affiliation strings stay in `loose` / `own_units` so papers of in-scope PIs are credited; they
# never add PIs or labs. Window 2016 onward, no 2026 in plots. The look-alike exclusions are identity, not scope, and always apply.
# D-rules below were the agent's recommendations; the owner CONFIRMED D1 and D2 on 2026-11-21 (leases/coord/DECISIONS.md D-0039) (hierarchy/uwashington/reports/STAGE-0.md): the snapshot extension filters by them.

