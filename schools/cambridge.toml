[thesis]
kind = "dspace"
base_url = "https://www.repository.cam.ac.uk/"
endpoints = []
robots = "unreachable"
note = "Pending host and endpoint verification. Collect explicit thesis supervisor statements only; repository authorship alone is not advising."
[collector]
channels = ["oa_arxiv", "openalex", "s2", "labpages"]
[students]
directories = []
adviser_directories = []
defense_lists = []
adviser_alumni = []
rosters = []
sources = ["thesis repository with explicit supervisor metadata", "dated official defence and graduation lists", "PI-owned lab member and alumni pages"]
[labpages]
skip_pages = []
hints = ["https://www.cst.cam.ac.uk/people/directory", "https://www.cst.cam.ac.uk/research", "https://www.eng.cam.ac.uk/research"]
[repository]
name = "Apollo University of Cambridge Repository (through permitted repository metadata, OpenAlex and CORE)"
pattern = 'repository\.cam\.ac\.uk'
[store]
path = "stores/cambridge"

