# University-wide discovery; full computing department, affiliated review elsewhere.
# Legacy site inventories are discovery leads, never accepted PI/paper links without current attribution checks.
key = "cambridge"
name = "University of Cambridge"
short = "Cambridge"
site_uni = "university-of-cambridge"
status = "onboarding"
order = 14
stage = 0
started = "2026-11-06"
window = [2016, 2026]

[ids]
openalex = ["I241749"]
openalex_related = []
openalex_excluded = ["I4210135132"]
ror = "https://ror.org/013meh722"
ids_note = "Verified local OpenAlex institutions snapshot and lineage, plus official ROR v2 API (HTTP200), 2026-11-06. Sweep all university lineage children except publishing companies. Related hospitals and trusts are not automatically university appointments; no related-only expansion initially. Every PI still needs a faculty appointment and computing scope. Colleges alone establish neither university employment nor lab membership."

[web]
domains = ["cam.ac.uk"]
email_domains = ["cam.ac.uk"]
wayback_only_suffixes = []
excluded_hosts = []

[affiliation]
regex = '\b(?:university\s+of\s+cambridge|cambridge\s+univ(?:ersity)?\.?)(?!\s+press)\b|\b(?:[\w-]+\.)*cam\.ac\.uk\b'
loose = 'cambridge|cam\.ac\.uk'
own_units = ''
must_match = ["University of Cambridge, United Kingdom", "Cambridge University, UK", "Department of Computer Science and Technology, University of Cambridge", "person@cam.ac.uk"]
must_not_match = ["Cambridge University Press", "Cambridge College, USA", "Cambridge, Massachusetts, USA", "Harvard University, Cambridge, MA", "Miami University, Oxford, Ohio"]

[dblp]
affiliation_strings = ["University of Cambridge", "Cambridge University"]
legacy_sweep = ""

[census]
computing_departments = ["CST"]
# BSU and CBU are constituent academic units listed alongside departments at
# https://www.medschl.cam.ac.uk/institutions, not multi-PI labs or cross-unit centres.
# Their individual PI labs remain separate from these academic home units.
center_units = ["DH"]
home_units = { "Computer Science and Technology" = 'computer science and technology', "Genetics" = '\bgenetics\b', "Chemistry" = '\bchemistry\b', "Medicine" = '\b(?:department of )?medicine\b', "Psychiatry" = '\bpsychiatry\b', "Plant Sciences" = '\bplant sciences\b', "Architecture" = '\barchitecture\b', "Physiology, Development and Neuroscience" = '\bphysiology,? development,? and neuroscience\b', "Chemical Engineering and Biotechnology" = '\bchemical engineering and biotechnology\b' }
rank_words = { ladder = '\b(?:prof|reader|university (?:senior )?lecturer)\b' }

[sweep_check]
exceptions = []
[cs_related]
not_faculty = {}
share_test_settles = []
[site]
depts = { CST = "Computer Science and Technology" }
full_codes = ["CST"]
[periods]
school_regex = '\b(?:university\s+of\s+cambridge|cambridge\s+univ(?:ersity)?\.?)(?!\s+press)\b|\b(?:[\w-]+\.)*cam\.ac\.uk\b'
[rules]
foreign_title_exception = false
listing_continuity = false

[[departments]]
code = "CST"
name = "Computer Science and Technology"
unit = "Department of Computer Science and Technology"
title_match = 'computer science|computer laboratory'
coverage = "full"
url = "https://www.cst.cam.ac.uk/people/directory"
  [[departments.listings]]
  slot = "main"
  kind = "main"
  url = "www.cst.cam.ac.uk/people/directory"
  from = "20210101"
  to = "20261231"
  prefix = false
  match = ""
  format = "cambridge_directory"
  title_filter = '^Faculty$'
  [[departments.listings]]
  slot = "legacy"
  kind = "main"
  url = "www.cl.cam.ac.uk/people/academic.html"
  from = "20160101"
  to = "20201231"
  prefix = false
  match = ""
  format = "cambridge_academic_staff"
  title_filter = ''

  # Current profile supplement; partial source group, never complete historical-directory coverage.
  [[departments.listings]]
  slot = "profiles"
  kind = "main"
  url = "www.cst.cam.ac.uk/people/"
  from = "20260101"
  to = "20261231"
  prefix = true
  match = '^https?://www\.cst\.cam\.ac\.uk/people/[a-z]+[0-9]+/?$'
  format = "cambridge_profile"
  title_filter = ''

