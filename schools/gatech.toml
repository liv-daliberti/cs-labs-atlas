# schools/<key>.toml: one school's charter (docs/ADDING-A-SCHOOL.md, stage 0). Copy this file to schools/<key>.toml,
# fill every field, run `python tools/school_config.py --check <key>` and `python tools/school_hosts.py <key>`, then
# commit it. Every stage tool reads the school from here; nothing else needs a school list (see the protocol's
# "files that must learn a new school" for the few that still do).
#
# Facts in this file are decisions about where to look, not evidence: evidence (url + sha256 + verbatim quote) lives in
# the captures and the stage outputs. Say how each identifier was verified in the *_note fields.


key = "gatech"
name = "Georgia Institute of Technology"
short = "Georgia Tech"
site_uni = ""
status = "onboarding"     # onboarding until the owner says otherwise
order = 9
stage = 0
started = "2026-11-03"
window = [2016, 2026]

[ids]
openalex = ["I130701444"]
# Owner decisions 2026-11-03, all four as recommended (hierarchy/gatech/reports/STAGE-0.md): D1 four College of Computing schools full, ECE/ISyE affiliated, ML/Math/BME searched;
# D2 GTRI, Georgia Tech-Europe and Georgia Tech-CNRS are out of PI scope unless a person holds a GT faculty listing (kept in the lineage sweep; decide exclusion at stage 7);
# D3 keep I130701444 and Coulter BME, exclude CTRN and the Space Grant Consortium, Georgia Tech-Europe dropped from related; D4 the regex does not match 'Georgia Tech Shenzhen'.
# Georgia Institute of Technology's lineage holds GTRI I4388482740, Georgia Tech-CNRS Laboratory I4210089931 (Metz), the Wallace H. Coulter BME
# Department I2802612298 (joint with Emory), the Center for Translational Research in Neuroimaging and Data Science I4210133909 and the Georgia
# Space Grant Consortium I4210101104. Georgia Tech-Europe I1288283403 is 'related' only (not lineage).
openalex_related = []
openalex_excluded = ["I4210133909", "I4210101104"]   # owner D3 2026-11-03: CTRN (tri-university centre) and the Space Grant Consortium
ror = "https://ror.org/01zkghx44"
ids_note = """OpenAlex institutions table of the 2026-10-14 snapshot (no API credits; checked 2026-11-03): I130701444 'Georgia Institute of Technology', ROR 01zkghx44,
country US, lineage [I130701444] (no parent; associated parent University System of Georgia I1289702989 is not lineage). Children whose lineage holds it (and ROR
children): Georgia Tech Research Institute I4388482740, Georgia Tech-CNRS Laboratory I4210089931, The Wallace H. Coulter Department of Biomedical Engineering
I2802612298, Center for Translational Research in Neuroimaging and Data Science I4210133909, Georgia Space Grant Consortium I4210101104. Related (not lineage):
Georgia Tech-Europe I1288283403 (ROR 02m5dy175, Metz), Moorea Coral Reef LTER, MSEE University Research Alliance. Not in the lineage and not swept: Georgia Tech
Foundation I4405270240, Georgia Tech Tools for Life I4210160906. Other Georgia institutions have their own lineages (Georgia State I181565077, University of Georgia,
Emory, Kennesaw State, Georgia Southern, Georgia Gwinnett). OpenAlex has no institution for the Georgia Tech Shenzhen Institute (a Tianjin University entity)."""

[web]
domains = ["gatech.edu"]
email_domains = ["gatech.edu", "cc.gatech.edu", "ece.gatech.edu", "isye.gatech.edu", "gtri.gatech.edu"]
wayback_only_suffixes = []
excluded_hosts = ["gsu.edu", "uga.edu", "emory.edu", "kennesaw.edu"]

[affiliation]
# 'Georgia Institute of Technology' (any spelling of Institute/Inst.), 'Georgia Tech' (not the Shenzhen institute, a Tianjin University entity: D4), 'Ga Tech',
# the gatech.edu domain, 'GTRI'. Never a bare 'Georgia' (Georgia State, University of Georgia, Georgia Southern, Georgia Gwinnett, Kennesaw State).
regex = '''georgia\s+inst\w*\.?\s+of\s+tech\w*|georgia\s+tech(?:nology)?\b(?!\W+shenzhen)|\bga\.?\s+tech\b|gatech\.edu|\bGTRI\b'''
own_units = '''\b(?:robotics\s+and\s+intelligent\s+machines|data\s+engineering\s+and\s+science|electronics\s+and\s+nanotechnology|people\s+and\s+technology|bioengineering\s+and\s+bioscience|sustainable\s+systems|research)\s+institute\b|\bgvu\s+center\b|\bmachine\s+learning\s+center\b'''
loose = '''georgia\s+(?:inst\w*\.?\s+of\s+)?tech\w*|gatech\.edu|atlanta,?\s+ga\b'''
must_match = [
  "Georgia Institute of Technology, Atlanta, GA 30332, USA",
  "School of Computer Science, Georgia Institute of Technology",
  "Georgia Inst. of Technology",
  "Georgia Tech, Atlanta",
  "College of Computing, Georgia Tech",
  "Georgia Tech Research Institute",
  "GTRI, Atlanta, GA",
  "jdoe@cc.gatech.edu",
  "Emory University and Georgia Institute of Technology",
  "Ga Tech",
]
must_not_match = [
  "Georgia State University, Atlanta, GA",
  "University of Georgia, Athens, GA",
  "Georgia Southern University",
  "Georgia Gwinnett College",
  "Kennesaw State University, Marietta, GA",
  "Emory University, Atlanta, GA 30322",
  "Georgia College & State University",
  "Georgia Tech Shenzhen Institute, Tianjin University",
  "Georgia Southwestern State University",
  "Southern Polytechnic State University",
  "Morehouse School of Medicine, Atlanta",
  "jdoe@gsu.edu",
  "Georgia Department of Transportation",
]

[dblp]
affiliation_strings = ["Georgia Institute of Technology", "Georgia Tech"]
legacy_sweep = ""

[rules]
foreign_title_exception = false

[census]
center_units = ["ML"]   # owner 2026-11-04: the ML Center is not a home
computing_departments = ["CS", "IC", "CSE", "CSP"]
home_units = {"Computer Science" = '^(?:School of )?Computer Science$', "Interactive Computing" = '^(?:School of )?Interactive Computing$', "Computational Science and Engineering" = '^(?:School of )?Computational Science (?:and|&) Engineering$', "Cybersecurity and Privacy" = '^(?:School of )?Cybersecurity (?:and|&) Privacy$', "Electrical and Computer Engineering" = '^(?:School of )?Electrical (?:and|&) Computer Engineering$', "Industrial and Systems Engineering" = '^(?:H\. Milton Stewart )?School of Industrial (?:and|&) Systems Engineering$', "Mathematics" = '^(?:School of )?Mathematics$', "Biomedical Engineering" = '^(?:The )?(?:Wallace H\. Coulter )?(?:Department of )?Biomedical Engineering$', "College of Architecture" = '^College of Architecture$'}

[sweep_check]
exceptions = []

[cs_related]
share_test_settles = []
not_faculty = {"Reza Sameni" = "held: no academic school of his is evidenced (the ML Center listing names none, his profile page names no GT unit); owner 2026-11-04: hold only those still without evidence", "Samuel Shapero" = "GTRI research engineer: the ML Center listing quote ran into the next person's title (owner 2026-11-04)"}

[site]
depts = {CS = "School of Computer Science", IC = "School of Interactive Computing", CSE = "School of Computational Science and Engineering", CSP = "School of Cybersecurity and Privacy"}
full_codes = ["CS", "IC", "CSE", "CSP"]

[periods]
school_regex = ''
profile_patterns = ["www.cc.gatech.edu/people/{first}-{last}", "scs.gatech.edu/people/{first}-{last}", "ic.gatech.edu/people/{first}-{last}", "cse.gatech.edu/people/{first}-{last}", "scp.cc.gatech.edu/people/{first}-{last}"]

