# Massachusetts Institute of Technology: released before protocol v1 (built 2026-10-17..27). Only the fields the released build and the
# shared tools read are filled; the stage-tool fields (listing slots, hosts) live in that school's own sweep code.
key = "mit"
name = "Massachusetts Institute of Technology"
short = "MIT"
site_uni = "massachusetts-institute-of-technology-mit"
status = "released"
order = 4
stage = 10
legacy = true
window = [2016, 2026]

[ids]
openalex = ["I63966007"]
openalex_related = []
ror = "https://ror.org/042nb2s44"
ids_note = "OpenAlex /institutions?filter=openalex_id 2026-10-29: display name and ROR as here"

[web]
domains = ["mit.edu"]

[affiliation]
regex = 'massachusetts\s+institute\s+of\s+technology|\bmit\b|mit\.edu|csail'
own_units = ''
loose = '\bmit\b|massachusetts|csail'          # pi_hierarchy.SCHOOL_LOOSE: any mention of the school on page 1
must_match = []
must_not_match = []

[dblp]
affiliation_strings = []
legacy_sweep = "claude-mit-20261020"

[rules]
foreign_title_exception = false
listing_continuity = true     # R-PAP-37, owner-approved 2026-11-06, 30-paper hand check passed

[census]
computing_departments = ["EECS", "CSAIL"]   # listed_not_in_census.py; [] = every listed department

[site]
depts = {EECS = "Electrical Engineering and Computer Science"}

# Institutional-repository harvest (fulltext-push/oai_repo.py; verdicts in docs/CHANNELS.md, "Repository harvests", 2026-11-04)
[oai_repo]
verdict = "harvest"
repository = "MIT Open Scholarship (DSpace 7)"
kind = "oai"
base = "https://dspace.mit.edu/server/oai/request"
prefix = "oai_dc"
sets = ["col_1721.1_49433", "com_1721.1_29806", "com_1721.1_5459", "com_1721.1_1775", "col_1721.1_3651"]   # OA Articles; CSAIL Digital Archive; AI Lab Publications; LIDS; Computer Science
seed = "mit_oa_articles"                  # raw/mit_oa_articles.sqlite: the OA Articles collection harvested whole on 2026-10-30, parsed without a request
seed_set = "col_1721.1_49433"
delay = 20                                # the pace that avoided 429s on 2026-10-30
landing = "https://hdl.handle.net/{id}"
relation_dois = true                      # MIT puts the published version DOI in dc:relation (92 of 100 sampled OA Articles records; dc:identifier has it in 3)

# Hosts the mit tools contact (stage 0, 2026-11-10). Derived from evidence: the raw capture stores (hierarchy/mit/raw/*captures*.sqlite) and the full-text download ledger (stores/mit/fulltext_assets.csv). The long tail of faculty personal sites is read per capture under school_web robots checks and is not enumerated here.
[[hosts]]
host = "web.archive.org"
use = "none"
purpose = "Wayback id_ captures and CDX (257 captures in the mit raw stores; listings, lab pages, theses)"
