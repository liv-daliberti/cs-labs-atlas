# Massachusetts Institute of Technology: released before protocol v1 (built 2026-10-17..27). Only the fields the released build and the
# shared tools read are filled; the stage-tool fields (listing slots, hosts) live in that school's own sweep code.
key = "mit"
name = "Massachusetts Institute of Technology"
short = "MIT"
site_uni = "massachusetts-institute-of-technology-mit"
status = "released"
order = 4
stage = 10
legacy = true
window = [2016, 2026]

[ids]
openalex = ["I63966007"]
openalex_related = []
ror = "https://ror.org/042nb2s44"
ids_note = "OpenAlex /institutions?filter=openalex_id 2026-10-29: display name and ROR as here"

[web]
domains = ["mit.edu"]

[affiliation]
regex = 'massachusetts\s+institute\s+of\s+technology|\bmit\b|mit\.edu|csail'
own_units = ''
loose = '\bmit\b|massachusetts|csail'          # pi_hierarchy.SCHOOL_LOOSE: any mention of the school on page 1
must_match = []
must_not_match = []

[dblp]
affiliation_strings = []
legacy_sweep = "claude-mit-20261020"

[rules]
foreign_title_exception = false
listing_continuity = true     # R-PAP-37, owner-approved 2026-11-06, 30-paper hand check passed

[census]
computing_departments = ["EECS", "CSAIL"]   # listed_not_in_census.py; [] = every listed department
home_units = {"EECS" = '^EECS$', "CSAIL" = '^CSAIL$', "Sloan School of Management" = '^Sloan School of Management$', "Aeronautics and Astronautics" = '^Aeronautics and Astronautics$', "Media Arts and Sciences" = '^Media Arts and Sciences$', "Mechanical Engineering" = '^Mechanical Engineering$', "Brain and Cognitive Sciences" = '^Brain and Cognitive Sciences$', "Mathematics" = '^Mathematics$', "Civil and Environmental Engineering" = '^Civil and Environmental Engineering$', "Physics" = '^Physics$', "Chemical Engineering" = '^Chemical Engineering$', "Applied Mathematics" = '^Applied Mathematics$', "Comparative Media Studies/Writing" = '^Comparative Media Studies/Writing$', "Urban Studies and Planning" = '^Urban Studies and Planning$', "Comparative Media Studies" = '^Comparative Media Studies$', "Economics" = '^Economics$', "Architecture" = '^Architecture$', "Anthropology" = '^Anthropology$', "Materials Science and Engineering" = '^Materials Science and Engineering$'}

[[departments]]
code = "EECS"
name = "Electrical Engineering and Computer Science"
unit = "MIT School of Engineering"
title_match = 'Professor|Lecturer|Instructor|Research Scientist'
coverage = "full"
url = "https://www.eecs.mit.edu/people/"
  [[departments.listings]]
  slot = "EECS Faculty and Advisors 2016–2021"
  kind = "main"
  url = "www.eecs.mit.edu/people/faculty-advisors"
  from = "20160101"
  to = "20211231"
  format = "mit_eecs_legacy_faculty"
  [[departments.listings]]
  slot = "EECS faculty role 2021–2026"
  kind = "main"
  url = "www.eecs.mit.edu/role/faculty/"
  from = "20211001"
  to = "20261231"
  format = "mit_eecs_faculty_cards"

[[departments]]
code = "CSAIL"
name = "Computer Science and Artificial Intelligence Laboratory"
unit = "MIT School of Engineering"
title_match = 'Professor|Principal Investigator|Research Scientist'
coverage = "full"
url = "https://www.csail.mit.edu/"
  [[departments.listings]]
  slot = "CSAIL principal investigators"
  kind = "main"
  url = "csail.mit.edu/people?person%5B0%5D=role%3A299"
  from = "20160101"
  to = "20261231"
  format = "mit_csail_pi"

[site]
depts = {EECS = "Electrical Engineering and Computer Science"}

# Institutional-repository harvest (fulltext-push/oai_repo.py; verdicts in docs/CHANNELS.md, "Repository harvests", 2026-11-04)
[oai_repo]
verdict = "harvest"
repository = "MIT Open Scholarship (DSpace 7)"
kind = "oai"
base = "https://dspace.mit.edu/server/oai/request"
prefix = "oai_dc"
sets = ["col_1721.1_49433", "com_1721.1_29806", "com_1721.1_5459", "com_1721.1_1775", "col_1721.1_3651"]   # OA Articles; CSAIL Digital Archive; AI Lab Publications; LIDS; Computer Science
seed = "mit_oa_articles"                  # raw/mit_oa_articles.sqlite: the OA Articles collection harvested whole on 2026-10-30, parsed without a request
seed_set = "col_1721.1_49433"
delay = 20                                # the pace that avoided 429s on 2026-10-30
landing = "https://hdl.handle.net/{id}"
relation_dois = true                      # MIT puts the published version DOI in dc:relation (92 of 100 sampled OA Articles records; dc:identifier has it in 3)

