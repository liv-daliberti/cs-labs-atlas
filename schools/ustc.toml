# --- students (phase after this push) ---
[thesis]
kind = "none"
base_url = ""
endpoints = []
robots = "unreachable"
note = "No thesis repository chosen at stage 0; Chinese degree theses are mostly CNKI (paywalled, never used). Students follow the PI-and-paper phase."

[students]
rosters = []
directories = []
sources = ["lab member pages and PI homepages (live where robots allows, else Wayback)"]

[labpages]
hints = ["<lab>.ustc.edu.cn", "staff.ustc.edu.cn/~<name>/", "faculty.ustc.edu.cn", "<name>.github.io", "personal homepages linked from the faculty list"]

[collector]
# 2026-11-18 (owner): CORE is allowed everywhere (DECISIONS 2026-11-15); core and core_bulk added after s2 (the longer USTC list is kept, as for SEU).
channels = ["oa_arxiv", "openalex", "proceedings", "arxiv_title", "dblp_ee", "s2", "core", "core_bulk", "europepmc", "pmc", "labpages", "pihomes"]

[repository]
name = "USTC institutional repository (not chosen; never asked)"
pattern = '''ustc\.edu\.cn/.*(?:thesis|repository)'''

[store]
path = "/n/fs/resemble/homogenizing-science/stores/ustc"

