# schools/ustc.toml: University of Science and Technology of China's charter (docs/ADDING-A-SCHOOL.md, v3 stage 0), filled 2026-11-07 for the owner's top-25 push.
# Facts here are decisions about where to look, not evidence. Lineage / related / excluded boundaries approved by owner 2026-11-11; see docs/STAGE0-COHORT-20261111.md
# (hierarchy/ustc/STAGE-0.md): nothing is swept or extended into the snapshot before that. Chinese official pages are the primary source; quotes stay in the original script,
# pinyin and English names are recorded as aliases for identity matching. 'order' is provisional; the coordinator sets it at landing.

key = "ustc"
name = "University of Science and Technology of China"
short = "USTC"
site_uni = "university-of-science-and-technology-of-china"
status = "onboarding"
order = 32
stage = 0
started = "2026-11-07"
window = [2016, 2026]

[ids]
openalex = ["I126520041"]
openalex_related = []
openalex_excluded = ["I4210140493", "I4405283751", "I4405255871"]
ror = "https://ror.org/04c4dkn09"
ids_note = """OpenAlex institutions table of the 2026-10-14 snapshot (no API credits; checked 2026-11-07): I126520041 'University of Science and Technology of China', ROR 04c4dkn09, CN, education, lineage [I126520041, I19820366]: the second id is the Chinese Academy of Sciences, USTC's PARENT, so the sweep filters on I126520041 alone
(lineage = CAS would pull every CAS institute). Lineage children (facilities): Hefei National Center for Physical Sciences at the Nanoscale I4210103894, CAS Key Laboratory of Urban Pollutant Conversion I4210124140, Hefei Material Science and Technology Center I4210139613,
National Synchrotron Radiation Laboratory I4210149848, State Key Labs of Nuclear Detection I4391767989 and Fire Science I4391768148, Collaborative Innovation Center of Advanced Microstructures I4210140493 (shared, excluded by owner-approved boundary).
Associated 'related': Collaborative Innovation Center of Suzhou Nano Science I4405255871 and Deep Space Exploration Laboratory I4405283751 (excluded by owner-approved boundary). 'University of Science and Technology Beijing/Liaoning' are other institutions."""

[web]
domains = ["ustc.edu.cn"]
email_domains = ["ustc.edu.cn", "mail.ustc.edu.cn"]
wayback_only_suffixes = []
excluded_hosts = []

[affiliation]
# Matches English forms, the domains and the Chinese name (raw affiliation strings in OpenAlex are mostly English; Chinese appears on pages).
regex = '''univ(?:ersity|\.)?\s+of\s+science\s+(?:and|&)\s+technology\s+of\s+china|\bustc\b|ustc\.edu\.cn|中国科学技术大学|中国科大'''
own_units = '''\b(?:institute\s+of\s+advanced\s+technology|hefei\s+national\s+laborator(?:y|ies)|national\s+synchrotron\s+radiation\s+laboratory)\b'''
loose = '''science\s+and\s+technology\s+of\s+china|\bustc\b|ustc\.edu\.cn|中国科学技术大学|中国科大|\bhefei\s+230026\b'''
must_match = [
  "School of Computer Science and Technology, University of Science and Technology of China, Hefei, Anhui, China",
  "USTC, Hefei 230026",
  "Univ. of Science and Technology of China",
  "jdoe@mail.ustc.edu.cn",
  "中国科学技术大学计算机科学与技术学院",
  "University of Science & Technology of China, Hefei"
]
must_not_match = [
  "University of Science and Technology Beijing",
  "University of Science and Technology Liaoning",
  "Hong Kong University of Science and Technology",
  "King Abdullah University of Science and Technology",
  "Chinese Academy of Sciences, Beijing",
  "Institute of Computing Technology, Chinese Academy of Sciences",
  "University of Chinese Academy of Sciences",
  "jdoe@ict.ac.cn",
  "Huazhong University of Science and Technology, Wuhan"
]

[dblp]
affiliation_strings = ["University of Science and Technology of China", "USTC"]
legacy_sweep = ""

[rules]
foreign_title_exception = false

[census]
computing_departments = ["CS"]
center_units = []
home_units = {"Computer Science and Technology" = '计算机科学与技术学院|计算机学院|^School of Computer Science(?: and Technology)?|^CS \(Computer Science and Technology\)$', "Information Science and Technology" = '信息科学技术学院|^School of Information Science (?:and|&) Technology', "Software Engineering" = '软件学院|School of Software Engineering', "Cyber Science and Technology" = '网络空间安全学院|School of Cyber Science', "Data Science" = '大数据学院|School of Data Science', "Automation (自动化系)" = '自动化系|^(?:AUTO \((?:Dept|Department) of Automation(?:, SIST)?\)|(?:Dept|Department) of Automation(?: \([^)]*\))?|Automation)$', "Electronic Engineering and Information Science (电子工程与信息科学系)" = '电子工程与信息科学系|^(?:(?:Dept|Department) of )?Electronic Engineering and Information Sciences?(?: \(EEIS\))?$|^EEIS \(Electronic Engineering and Information Science\)$', "School of Mathematical Sciences (数学科学学院)" = '数学科学学院|^School of Mathematical Sciences(?:, USTC)?$'}
# Chinese titles (\\b is not used: CJK counts as a word character). 教授 professor (副教授 associate), 讲师 lecturer; the earlier stage-0 words stay.
rank_words = {research = '特任研究员|特任副研究员|研究员|副研究员|\bresearch\s+(?:fellow|professor|associate)', courtesy = '兼职|\bjoint\b', teaching = '特任教授|\bsenior\s+lecturer', ladder = '教授', lecturer = '讲师|助教'}

[sweep_check]
exceptions = []

[cs_related]
not_faculty = {}
share_test_settles = []

[site]
depts = {CS = "School of Computer Science and Technology"}
full_codes = ["CS"]

[periods]
school_regex = ''
profile_patterns = []

