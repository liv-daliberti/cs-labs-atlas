# schools/seu.toml: Southeast University's charter (docs/ADDING-A-SCHOOL.md, v3 stage 0), filled 2026-11-07 for the owner's top-25 push.
# Facts here are decisions about where to look, not evidence. Lineage / related / excluded boundaries approved by owner 2026-11-11; see docs/STAGE0-COHORT-20261111.md
# (hierarchy/seu/STAGE-0.md): nothing is swept or extended into the snapshot before that. Chinese official pages are the primary source; quotes stay in the original script,
# pinyin and English names are recorded as aliases for identity matching. 'order' is provisional; the coordinator sets it at landing.

key = "seu"
name = "Southeast University"
short = "SEU"
site_uni = "southeast-university"
status = "onboarding"
order = 33
stage = 0
started = "2026-11-07"
window = [2016, 2026]

[ids]
openalex = ["I76569877"]
openalex_related = []
openalex_excluded = ["I4403386554"]
ror = "https://ror.org/04ct4d772"
ids_note = """OpenAlex institutions table of the 2026-10-14 snapshot (no API credits; checked 2026-11-07): I76569877 'Southeast University', ROR 04ct4d772, CN, education, lineage [I76569877]. Lineage children (facilities): State Key Laboratories of Mobile Communications I4391768199, Millimeter Waves I4391768253, Digital Medical Engineering I4387154005.
Associated 'related': Zhongda Hospital I4210105806, Yixing People's Hospital, Nanjing Second Hospital, Southeast University Chengxian College I4403386554 (an independent college, excluded by owner-approved boundary), Collaborative Innovation Center of Suzhou Nano Science I4405255871. Name look-alikes (not SEU): Southeast University Bangladesh, South East European University, Southeastern University (Florida)."""

[web]
domains = ["seu.edu.cn"]
email_domains = ["seu.edu.cn"]
wayback_only_suffixes = []
excluded_hosts = []

[affiliation]
# Matches English forms, the domains and the Chinese name (raw affiliation strings in OpenAlex are mostly English; Chinese appears on pages).
regex = '''southeast\s+univ(?:ersity)?\b(?!\s+(?:bangladesh|of\s+bangladesh|chengxian|college|\(bd\))|,\s+dhaka)|seu\.edu\.cn|东南大学(?!成贤)'''
own_units = '''\b(?:state\s+key\s+laboratory\s+of\s+(?:mobile\s+communications|millimeter\s+waves)|national\s+asic\s+system\s+engineering)\b'''
loose = '''southeast\s+univ|seu\.edu\.cn|东南大学|\bnanjing\s+21(?:0096|1189)\b'''
must_match = [
  "School of Computer Science and Engineering, Southeast University, Nanjing 210096, China",
  "Southeast University, Nanjing, China",
  "Southeast Univ., Nanjing",
  "jdoe@seu.edu.cn",
  "东南大学计算机科学与工程学院",
  "State Key Laboratory of Millimeter Waves, Southeast University"
]
must_not_match = [
  "Southeast University Bangladesh, Dhaka",
  "Southeast University, Dhaka, Bangladesh",
  "South East European University, Tetovo",
  "Southeastern University, Lakeland, Florida",
  "Southeast Missouri State University",
  "Southeast University Chengxian College, Nanjing",
  "Nanjing University, Nanjing",
  "Nanjing University of Science and Technology",
  "jdoe@nju.edu.cn",
  "东南大学成贤学院"
]

[dblp]
affiliation_strings = ["Southeast University"]
legacy_sweep = ""

[rules]
foreign_title_exception = false

[census]
computing_departments = ["CS"]
center_units = []
home_units = {"Computer Science and Engineering" = '计算机科学与工程学院|软件学院|人工智能学院|^School of Computer Science (?:and|&) Engineering', "Cyber Science and Engineering" = '网络空间安全学院|School of Cyber Science', "Automation" = '自动化学院|^School of Automation', "Information Science and Engineering" = '信息科学与工程学院|^School of Information Science (?:and|&) Engineering', "Intelligent Science and Engineering" = '智能科学与工程学院|School of Intelligent Science'}
rank_words = {research = '研究员|副研究员|\bresearch\s+(?:fellow|professor|associate)', courtesy = '兼职|\bjoint\b', teaching = '教学|\bsenior\s+lecturer'}

[sweep_check]
exceptions = []

[cs_related]
not_faculty = {}
share_test_settles = []

[site]
depts = {CS = "School of Computer Science and Engineering"}
full_codes = ["CS"]

[periods]
school_regex = ''
profile_patterns = []

