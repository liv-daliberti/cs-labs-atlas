# Lab hunt 2026-11-23 (owner: "uestc <-- also think we're missing labs"): the graduate school's official supervisor directory
# (yjsjy.uestc.edu.cn/gmis/jcsjgl/dsfc, 导师风采) lists every graduate supervisor by school with a personal page giving 职称 (rank),
# 属性 (专职 full-time / 兼职 adjunct) and the majors and 招生类别 (doctoral / master's) the person recruits for. Computing units are
# whole-unit computing (software school, intelligent computing institute); mixed units admit a person only through a doctoral major
# that is computing (0812, 0835, 0839, 1405, or 0854 directions naming computer/AI/software) or two strict computing terms in the
# person's doctoral research directions, never by membership.
